<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f5f1">
<title>·</title>
<script>(function(){try{if(localStorage.getItem("theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute("content","#141311");}}}catch(e){}})();</script>
<style>

  :root {
    color-scheme: light;
    --bg:        #f5f4ef;
    --bg-grad:   #efece4;
    --surface:   #ffffff;
    --surface-2: #faf9f5;
    --ink:       #161616;
    --ink-soft:  #4a4a48;
    --muted:     #86857e;
    --faint:     #b5b3aa;
    --line:        #ece9df;
    --line-soft:   #f3f1e9;
    --line-strong: #c8c2ad;
    --accent:    #161616;
    --green:     #2f7d4f;
    --green-soft:#e8f1ea;
    --green-line:#cfe3d3;
    --red:       #b3403a;
    --amber-soft:#f4ecdc;
    --amber:     #9a6b1f;
    --radius:    12px;
    --radius-sm: 10px;
    --shadow:    0 1px 2px rgba(20, 18, 12, 0.04),
                 0 12px 36px rgba(20, 18, 12, 0.06);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg:        #141311;
    --bg-grad:   #1c1a15;
    --surface:   #1d1c19;
    --surface-2: #242320;
    --ink:       #eceae3;
    --ink-soft:  #b6b4ab;
    --muted:     #8b897f;
    --faint:     #5e5c53;
    --line:        #33322c;
    --line-soft:   #2a2924;
    --line-strong: #4a4840;
    --accent:    #eceae3;
    --green:     #7cbe97;
    --green-soft:#1f3226;
    --green-line:#2e4a38;
    --red:       #e0857c;
    --amber-soft:#383021;
    --amber:     #d3a04f;
    --radius:    12px;
    --radius-sm: 10px;
    --shadow:    0 1px 2px rgba(0, 0, 0, 0.30),
                 0 12px 36px rgba(0, 0, 0, 0.40);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), transparent 70%);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: visible;
    position: relative;
    min-height: 220px;
    display: flex;
    flex-direction: column;
  }

  .live-header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity .45s ease, max-height .45s ease, padding .45s ease, border-color .45s ease;
    max-height: 200px;
    overflow: hidden;
  }
  .live-header.done {
    opacity: 0;
    max-height: 0;
    padding-top: 0; padding-bottom: 0;
    border-color: transparent;
    pointer-events: none;
  }

  .live-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .live-label {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: -0.005em;
  }

  .dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 14px;
  }
  .dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.2;
    animation: dotPulse 1.4s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%, 70%, 100% { opacity: 0.2; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-2px); }
  }
  .live-header.done .dots span { animation: none; }

  .live-count {
    font-size: 12.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .live-count b { color: var(--ink-soft); font-weight: 600; }

  .live-track {
    height: 2px;
    background: var(--line-soft);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .live-bar {
    height: 100%;
    width: 0%;
    background: var(--ink);
    border-radius: 999px;
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }

  .list {
    flex: 1;
    padding: 6px 8px;
    overflow-y: auto;
    max-height: 60vh;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  .item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    color: inherit;
    transition: background .14s ease;
    animation: itemIn .42s cubic-bezier(.21,.8,.35,1) both;
  }
  .item:hover { background: var(--surface-2); }
  .item:active { background: var(--line-soft); }
  @keyframes itemIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .check {
    flex-shrink: 0;
    width: 19px; height: 19px;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--green-line);
  }
  .check svg { width: 10px; height: 10px; stroke-width: 3; }

  .host {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 13.5px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }

  .arrow {
    flex-shrink: 0;
    color: var(--faint);
    transition: color .14s ease, transform .14s ease;
    display: flex;
    align-items: center;
  }
  .item:hover .arrow {
    color: var(--ink);
    transform: translateX(2px);
  }

  .group-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 13px 14px 4px;
    user-select: none;
  }
  .group-head:first-child { padding-top: 7px; }
  .group-head .gh-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .group-head .gh-count {
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .group-head.fgroup { padding: 10px 10px 3px; }
  .group-head.fgroup:first-child { padding-top: 4px; }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--line-soft);
    gap: 12px;
  }
  .count {
    font-size: 12.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    letter-spacing: 0.005em;
  }
  .count b { color: var(--ink); font-weight: 600; }

  .copy-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s, border-color .14s, color .14s;
  }
  .copy-btn:hover {
    background: var(--surface-2);
    border-color: var(--line);
    color: var(--ink);
  }
  .copy-btn:active { transform: translateY(0.5px); }
  .copy-btn:disabled { opacity: .45; cursor: not-allowed; }
  .copy-btn svg { width: 13px; height: 13px; flex: none; }
  .retry-btn:active, .t-btn:active, .mv-play:active, .g-retry:active { transform: translateY(0.5px); }

  .state-empty, .state-error {
    padding: 56px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .state-empty .glyph, .state-error .glyph {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
    color: var(--faint);
  }
  .state-empty .msg, .state-error .msg {
    font-size: 14.5px;
    color: var(--ink-soft);
    letter-spacing: -0.005em;
  }
  .retry-btn {
    margin-top: 14px;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s;
  }
  .retry-btn:hover { background: #2a2a2a; }

  .blocker-bar {
    position: relative;
    padding: 14px 16px 0;
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .blocker-trigger {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    transition: background .14s, border-color .14s;
    min-height: 46px;
  }
  .blocker-trigger:hover:not(:disabled) { background: var(--surface-2); }
  .blocker-trigger:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .blocker-trigger:disabled { opacity: .55; cursor: not-allowed; }

  .blocker-trigger-logo {
    flex-shrink: 0;
    width: 88px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .blocker-trigger-logo img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
  }
  .blocker-trigger-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .blocker-trigger-chev {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: var(--muted);
    transition: transform .18s ease;
  }
  .blocker-trigger[aria-expanded="true"] .blocker-trigger-chev { transform: rotate(180deg); }

  .blocker-menu {
    position: absolute;
    top: calc(100% + 6px);
    max-height: 360px;
    overflow-y: auto;
    scrollbar-width: thin;
    left: 16px;
    right: 16px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow:
      0 1px 2px rgba(20, 18, 12, 0.06),
      0 12px 36px rgba(20, 18, 12, 0.14);
    max-height: 262px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    padding: 5px;
    z-index: 60;
    animation: menuIn .18s cubic-bezier(.21,.8,.35,1) both;
    transform-origin: top center;
  }
  .blocker-menu[hidden] { display: none; }
  .blocker-menu::-webkit-scrollbar { width: 6px; }
  .blocker-menu::-webkit-scrollbar-track { background: transparent; }
  .blocker-menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  .blocker-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
    font-size: 13.5px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background .12s ease;
  }
  .blocker-option:hover { background: var(--surface-2); }
  .blocker-option:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .blocker-option[aria-selected="true"] { background: var(--green-soft); }

  .blocker-option-mark {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    opacity: 0;
  }
  .blocker-option[aria-selected="true"] .blocker-option-mark { opacity: 1; }

  .blocker-option-logo {
    flex-shrink: 0;
    width: 96px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .blocker-option-logo img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .blocker-option-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .blocker-option-name {
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.005em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .blocker-option-desc {
    font-size: 11.5px;
    color: var(--faint);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .blocker-option[aria-selected="true"] .blocker-option-name { color: var(--green); }
  .blocker-option[aria-selected="true"] .blocker-option-desc { color: var(--green); }

  .post-bar {
    position: relative;
    padding: 8px 16px 0;
    flex-shrink: 0;
  }

  .post-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    transition: background .14s, border-color .14s;
    min-height: 44px;
  }
  .post-trigger:hover:not(:disabled) { background: var(--surface); border-color: var(--line-strong); }
  .post-trigger:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .post-trigger:disabled { opacity: .55; cursor: not-allowed; }

  .post-trigger-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .post-trigger-date {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .post-trigger-chev {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: var(--muted);
    transition: transform .18s ease;
  }
  .post-trigger[aria-expanded="true"] .post-trigger-chev { transform: rotate(180deg); }

  .post-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 16px;
    right: 16px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow:
      0 1px 2px rgba(20, 18, 12, 0.06),
      0 12px 36px rgba(20, 18, 12, 0.14);
    max-height: 320px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    padding: 5px;
    z-index: 50;
    animation: menuIn .18s cubic-bezier(.21,.8,.35,1) both;
    transform-origin: top center;
  }
  .post-menu[hidden] { display: none; }
  .post-menu::-webkit-scrollbar { width: 6px; }
  .post-menu::-webkit-scrollbar-track { background: transparent; }
  .post-menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-4px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .post-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
    font-size: 13.5px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background .12s ease;
  }
  .post-option:hover { background: var(--surface-2); }
  .post-option:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .post-option[aria-selected="true"] { background: var(--green-soft); }

  .post-option-mark {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    opacity: 0;
  }
  .post-option[aria-selected="true"] .post-option-mark { opacity: 1; }

  .post-option-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .post-option-date {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .post-option[aria-selected="true"] .post-option-date { color: var(--green); }

  @media (max-width: 560px) {
    body { padding: 16px 14px; }
    .container { max-width: 100%; border-radius: 12px; }
    .live-header { padding: 18px 18px 14px; }
    .blocker-bar { padding: 12px 12px 0; }
    .blocker-menu { left: 12px; right: 12px; }
    .post-bar { padding: 8px 12px 0; }
    .post-menu { left: 12px; right: 12px; }
    .item { padding: 11px 12px; gap: 11px; }
    .footer { padding: 12px 14px 14px; }
    .list { max-height: 55vh; }
  }


  .item .why-cat {
    flex-shrink: 1;
    min-width: 0;
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--faint);
    letter-spacing: 0;
    cursor: pointer;
    border-bottom: 1px dotted var(--line-strong);
    transition: color .14s ease, border-color .14s ease;
  }
  .item .why-cat:hover { color: var(--ink-soft); border-bottom-color: var(--muted); }

  .filtered {
    border-top: 1px solid var(--line-soft);
    padding: 0 16px;
    flex-shrink: 0;
  }
  .filtered-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 0 4px;
    background: none;
    border: none;
    font: inherit;
    font-size: 12.5px;
    color: var(--faint);
    cursor: pointer;
    transition: color .14s ease;
  }
  .filtered-toggle:hover { color: var(--muted); }
  .filtered-toggle b {
    color: var(--muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .filtered-toggle .chev { display: flex; transition: transform .18s ease; }
  .filtered-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .filtered-list { padding: 2px 0 12px; display: none; }
  .filtered-list.open { display: block; }

  .frow {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 10px;
    transition: background .14s ease;
  }
  .frow:hover { background: var(--surface-2); }
  .frow .fhost {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }
  .frow .fwhy {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--faint);
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  button.fwhy.cat {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px dotted var(--line-strong);
    cursor: pointer;
    transition: color .14s ease, border-color .14s ease;
  }
  button.fwhy.cat:hover { color: var(--ink); border-bottom-color: var(--muted); }

  @media (max-width: 560px) {
    .filtered { padding: 0 14px; }
    .item .why-cat { display: none; }
    .frow .fwhy { max-width: 52%; }
  }
  @media (prefers-reduced-motion: reduce) {

    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .test-title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .test-sub {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .test-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .test-row { display: flex; gap: 8px; }
  .t-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 9px 11px;
    min-height: 40px;
    letter-spacing: -0.005em;
    transition: border-color .14s ease, background .14s ease;
  }
  .t-input::placeholder { color: var(--faint); letter-spacing: 0; }
  .t-input:focus { outline: none; border-color: var(--ink); }
  .t-btn {
    flex-shrink: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 10px;
    padding: 9px 18px;
    min-height: 40px;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease;
  }
  .t-btn:hover { background: #2a2a2a; border-color: #2a2a2a; }
  .t-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .t-btn[disabled] { opacity: .5; cursor: default; }
  .test-err {
    font-size: 12.5px;
    color: var(--red);
    line-height: 1.5;
  }
  .t-result {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    animation: itemIn .42s cubic-bezier(.21,.8,.35,1) both;
  }
  .t-vrow {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .t-state {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 0;
  }
  .t-state.ok { color: var(--green); }
  .t-state.bad { color: var(--red); }
  .t-state.unk { color: var(--muted); }
  .t-why {
    flex-shrink: 1;
    max-width: 55%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
    color: var(--faint);
  }
  .t-actions { gap: 8px; }
  .t-open, .t-copy {
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 7px 12px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background .14s ease, border-color .14s ease;
  }
  .t-open:hover, .t-copy:hover { background: var(--surface-2); border-color: var(--ink); }
  .t-open:focus-visible, .t-copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .t-copy svg { width: 13px; height: 13px; flex: none; }
  .t-time {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .check.bad { background: #f6e9e7; color: var(--red); border-color: #e8c9c5; }
  .check.unk { background: var(--surface-2); color: var(--faint); border-color: var(--line-strong); }
  html[data-theme="dark"] .check.bad { background: #3a2723; border-color: #5c3a33; }
  html[data-theme="dark"] .start-glyph.g3 { background: #3a2723; }
  html[data-theme="dark"] .t-btn { color: #171614; }
  html[data-theme="dark"] .t-btn:hover { background: #dcd8cf; border-color: #dcd8cf; }

  .list-bar { padding: 8px 8px 0; }
  .l-input {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 11px;
    transition: border-color .14s ease, background .14s ease;
  }
  .l-input::placeholder { color: var(--faint); }
  .l-input:focus { outline: none; border-color: var(--ink); }

  .start-stats {
    font-size: 11.5px;
    color: var(--faint);
    text-align: center;
    border-top: 1px solid var(--line-soft);
    padding-top: 12px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  .g-card { position: relative; }
  .g-pin {
    position: absolute;
    top: 13px;
    right: 13px;
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    z-index: 2;
    transition: opacity .14s ease, color .14s ease, background .14s ease, border-color .14s ease;
  }
  .g-card:hover .g-pin, .g-pin:focus-visible, .g-pin.on { opacity: 1; }
  .g-pin:hover { color: var(--ink); border-color: var(--line-strong); }
  .g-pin:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .g-pin.on { background: var(--green-soft); border-color: var(--green-line); color: var(--green); }
  .g-pin svg { width: 11px; height: 11px; }

  @media (max-width: 560px) {
    .test { max-width: 100%; }
    .test-body { padding: 14px; }
  }
</style>
</head>
<body>

  <div class="start-card" id="startScreen">
    <div class="start-hello">
      <span>What do you want to open?</span>
      <button class="theme-btn sm" type="button" title="Switch theme" aria-label="Switch between light and dark theme">

      </button>
    </div>
    <div class="start-choices">

        <span class="start-glyph" aria-hidden="true">

        </span>
        <span class="start-name">Check links</span>
      </button>
      <button class="start-choice" id="choiceGames" type="button">
        <span class="start-glyph g2" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.144C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.266-.007-.043-.011-.092-.017-.144A4 4 0 0 0 17.32 5z"/></svg>
        </span>
        <span class="start-name">Play games</span>
      </button>
      <button class="start-choice" id="choiceMovies" type="button">
        <span class="start-glyph g3" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="15" rx="0"/><path d="M2 9h3M2 12h3M2 15h3M19 9h3M19 12h3M19 15h3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>
        </span>
        <span class="start-name">Watch movies</span>
      </button>
      <button class="start-choice" id="choiceTest" type="button">
        <span class="start-glyph g4" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </span>
        <span class="start-name">Test a link</span>
      </button>
    </div>
    <div class="start-stats" id="startStats" style="display:none"></div>
  </div>

  <div class="games" id="gamesView" style="display:none">
    <div class="games-head">
      <div class="games-title-row">
        <button class="barhome" id="gamesHome" type="button" title="Back to start" aria-label="Back to start">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 class="games-title">GN-Math games</h2>
        <span class="games-count" id="gCount"></span>
        <button class="theme-btn push" type="button" title="Switch theme" aria-label="Switch between light and dark theme">
          <span class="tb-ic tb-moon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>
          <span class="tb-ic tb-sun" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        </button>
      </div>
      <div class="games-tools">
        <input class="g-input" id="gSearch" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false" aria-label="Search games">
        <select class="g-select" id="gSort" aria-label="Sort games">
          <option value="name">A–Z</option>
          <option value="new">Newest</option>
        </select>
        <select class="g-select" id="gTag" aria-label="Filter by tag">
          <option value="">All tags</option>
        </select>
      </div>
    </div>
    <div class="g-body" id="gBody">
      <div class="g-state" id="gState">
        <div class="g-msg" id="gMsg">Loading games…</div>
        <button class="g-retry" id="gRetry" type="button" style="display:none">Try again</button>
      </div>
      <div class="g-grid" id="gGrid" style="display:none"></div>
    </div>
    <div class="g-player" id="gPlayer" style="display:none">
      <div class="g-phead">
        <button class="g-back" id="gBack" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          All games
        </button>
        <div class="g-pmeta">
          <span class="g-pname" id="gPName"></span>
          <span class="g-pauthor" id="gPAuthor"></span>
        </div>
        <div class="g-pbtns">
          <button class="g-pbtn" id="gFull" type="button">Fullscreen</button>
          <button class="g-pbtn" id="gNewTab" type="button">New tab</button>
        </div>
      </div>
      <div class="g-load" id="gLoad" style="display:none">Loading game…</div>
      <iframe class="g-frame" id="gFrame" title="game" allowfullscreen referrerpolicy="no-referrer" allow="fullscreen; autoplay; gamepad"></iframe>
    </div>
  </div>
  <div class="games" id="moviesView" style="display:none">
    <div class="games-head">
      <div class="games-title-row">
        <button class="barhome" id="moviesHome" type="button" title="Back to start" aria-label="Back to start">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 class="games-title">Movies &amp; series</h2>
        <button class="mv-sig" id="mvSignal" type="button" title="Data route — which relay is serving the movie data; click to retry" aria-label="Data route"></button>
        <button class="theme-btn push" type="button" title="Switch theme" aria-label="Switch between light and dark theme">
          <span class="tb-ic tb-moon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>
          <span class="tb-ic tb-sun" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        </button>
      </div>
      <div class="games-tools mv-tools">
        <div class="mv-tabs">
          <button class="mv-tab on" id="mvTabTrending" type="button">Trending</button>
          <button class="mv-tab" id="mvTabFilms" type="button">Films</button>
          <button class="mv-tab" id="mvTabSeries" type="button">Series</button>
          <button class="mv-tab" id="mvTabAnime" type="button">Anime</button>
        </div>
        <input class="g-input" id="mvSearch" type="search" placeholder="Search movies and series…" autocomplete="off" spellcheck="false" aria-label="Search movies and series">
      </div>
    </div>
    <div class="g-body" id="mvBody">
      <div class="mv-resume" id="mvResume" style="display:none">
        <div class="mv-resume-label">Continue watching</div>
        <div class="mv-rstrip" id="mvRstrip"></div>
      </div>
      <div class="g-state" id="mvState">
        <div>Loading…</div>
        <button class="g-retry" id="mvRetry" type="button" style="display:none">Try again</button>
      </div>
      <div class="mv-grid" id="mvGrid" style="display:none"></div>
      <div class="g-sentinel" id="mvMore"></div>
      <div class="mv-detail" id="mvDetail" style="display:none"></div>
    </div>
    <div class="g-player" id="mvPlayer" style="display:none">
      <div class="g-phead">
        <div class="g-pmeta">
          <div class="g-pname" id="mvPName"></div>
          <div class="g-pauthor" id="mvPSub"></div>
        </div>
        <div class="g-pbtns">
          <button class="g-pbtn" id="mvPrev" type="button" title="Previous episode"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Prev</span></button>
          <button class="g-pbtn" id="mvNext" type="button" title="Next episode"><span>Next</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>

          <button class="g-pbtn" id="mvFull" type="button">Fullscreen</button>
          <button class="g-back" id="mvBack" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span>Back</span></button>

  <div class="container" id="container" style="display:none">

    <div class="blocker-bar" id="blockerBar">

          <img id="blockerTriggerLogoImg" alt="" src="" />

        <span class="blocker-trigger-text" id="blockerTriggerText">Lightspeed Systems</span>
        <span class="blocker-trigger-chev" aria-hidden="true">

        </span>
      </button>
      <button class="theme-btn" type="button" title="Switch theme" aria-label="Switch between light and dark theme">
        <span class="tb-ic tb-moon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>
        <span class="tb-ic tb-sun" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
      </button>
      <div class="blocker-menu" id="blockerMenu" role="listbox" hidden></div>

    <div class="post-bar" id="postBar" style="display:none">

        </span>
      </button>
      <div class="post-menu" id="postMenu" role="listbox" hidden></div>
    </div>

    <div class="live-header" id="liveHeader">
      <div class="live-row">
        <span class="live-label">
          <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span id="liveLabel">Looking through the latest post…</span>
        </span>
        <span class="live-count" id="liveCount"></span>
      </div>
      <div class="live-track"><div class="live-bar" id="liveBar"></div></div>
    </div>

    <div class="list-bar" id="listBar" style="display:none">
      <input class="l-input" id="listSearch" type="search" placeholder="Filter these links…" autocomplete="off" spellcheck="false" aria-label="Filter unblocked links">
    </div>

    <div class="list" id="list"></div>

    <div class="filtered" id="filteredWrap" style="display:none">
      <button class="filtered-toggle" id="filteredToggle" type="button" aria-expanded="false">
        <b id="filteredNum">0</b> <span id="filteredLabel">filtered out</span>
        <span class="chev" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
      <div class="filtered-list" id="filteredList"></div>
    </div>

    <div class="state-empty" id="stateEmpty" style="display:none">
      <span class="glyph">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.5V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h7"/>
          <path d="M16 19l2 2 4-4"/>
        </svg>
      </span>
      <div class="msg">Nothing unblocked this time.</div>
    </div>

    <div class="state-error" id="stateError" style="display:none">
      <span class="glyph">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
      </span>
      <div class="msg" id="errorMsg">Couldn't reach the blog right now.</div>
      <button class="retry-btn" id="retryBtn" type="button">Try again</button>
    </div>

var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
var ARROW_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

function groupKeyOf(host) {
  return prettyGroupName(groupOf.get(host) || "links").toLowerCase();
}

function groupHeadEl(gk) {
  var kids = list.children;
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].classList && kids[i].classList.contains("group-head") &&
        kids[i].getAttribute("data-g") === gk) return kids[i];
  }
  return null;
}

function freshGroupHead(gk) {
  var gh = document.createElement("div");
  gh.className = "group-head";
  gh.setAttribute("data-g", gk);
  var nm = document.createElement("span");
  nm.className = "gh-name";
  nm.textContent = prettyGroupName(gk);
  var ct = document.createElement("span");
  ct.className = "gh-count";
  gh.appendChild(nm);
  gh.appendChild(ct);
  return gh;
}

function refreshGroupCount(gk) {
  var gh = groupHeadEl(gk);
  if (!gh) return;
  var n = 0, el = gh.nextElementSibling;
  while (el && !(el.classList && el.classList.contains("group-head"))) {
    n++;
    el = el.nextElementSibling;
  }
  var ct = gh.querySelector(".gh-count");
  if (ct) ct.textContent = n ? String(n) : "";
  if (!n && gh.parentNode) gh.parentNode.removeChild(gh);
}

function insertGrouped(row, host) {
  var gk = groupKeyOf(host);
  row.setAttribute("data-gk", gk + "|" + host);
  var gh = null;
  if (showGroups) {
    gh = groupHeadEl(gk);
    if (!gh) {
      gh = freshGroupHead(gk);
      var kids = list.children, placed = false;
      for (var i = 0; i < kids.length; i++) {
        if (kids[i].classList && kids[i].classList.contains("group-head") &&
            kids[i].getAttribute("data-g") > gk) {
          list.insertBefore(gh, kids[i]);
          placed = true;
          break;
        }
      }
      if (!placed) list.appendChild(gh);
    }
  }
  var el = gh ? gh.nextElementSibling : list.children[0];
  while (el) {
    if (el.classList && el.classList.contains("group-head")) break;
    if ((el.getAttribute("data-gk") || "") > gk + "|" + host) break;
    el = el.nextElementSibling;
  }
  if (el) list.insertBefore(row, el);
  else list.appendChild(row);
  if (showGroups) refreshGroupCount(gk);
}

function appendUnblocked(host, url, v) {
  if (rowMap.has(host)) return;
  var a = document.createElement("a");
  a.className = "item";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  var check = document.createElement("span");
  check.className = "check";
  check.innerHTML = CHECK_SVG;
  var h = document.createElement("span");
  h.className = "host";
  h.textContent = host;
  a.appendChild(check);
  a.appendChild(h);
  if (v && v.catId != null) {
    var why = document.createElement("button");
    why.type = "button";
    why.className = "why-cat";
    why.textContent = "Policy: " + (v.cat || "");
    why.title = "Mark this category blocked / allowed at your school";
    why.addEventListener("click", onCatClick);
    a.appendChild(why);
  } else if (v && (v.via === "answered" || v.via === "hostov")) {
    var why2 = document.createElement("button");
    why2.type = "button";
    why2.className = "why-cat";
    why2.textContent = whyText(v);
    why2.title = "Mark this site blocked / allowed yourself";
    why2.addEventListener("click", onHostClick);
    a.appendChild(why2);
  }
  var ar = document.createElement("span");
  ar.className = "arrow";
  ar.innerHTML = ARROW_SVG;
  a.appendChild(ar);
  insertGrouped(a, host);
  if (listBar.style.display === "none") listBar.style.display = "";
  if (listSearch.value.trim()) applyListFilter();
  rowMap.set(host, { url: url, el: a });
  unblockedCount++;
  countNum.textContent = String(unblockedCount);
  footer.style.display = "";
}

function whyText(v) {
  if (v.state === "blocked") {
    if (v.via === "fp") return "Block Page";
    if (v.via === "db") return v.cat ? "Policy: " + v.cat : "Filtered";
    if (v.via === "secrl") return "Site Live, Blocked Here";
    if (v.via === "refuses") return "Site Refuses" + (v.code ? " (" + v.code + ")" : "");
    if (v.via === "secno") return "Filtered (Dropped)";
    if (v.via === "hostov") return "Your Call";
    return "No Connection";
  }
  if (v.via === "dead") return "Domain Dead";
  if (v.via === "unreachable") return "No Connection";
  if (v.via === "cat") return v.cat ? "Category: " + v.cat : "Unverified";
  if (v.via === "conflict") return "Another Filter Answered";
  if (v.via === "answered") return "Answered";
  if (v.via === "hostov") return "Your Call";
  return "Unverified";
}

function renderFiltered() {
  filteredList.textContent = "";
  var frows = filteredRows.slice().sort(function (a, b) {
    var ga = groupKeyOf(a.host), gb = groupKeyOf(b.host);
    if (ga !== gb) return ga < gb ? -1 : 1;
    return a.host < b.host ? -1 : a.host > b.host ? 1 : 0;
  });
  var curG = null;
  frows.forEach(function (fr) {
    if (showGroups) {
      var gk = groupKeyOf(fr.host);
      if (gk !== curG) {
        curG = gk;

        gh.textContent = prettyGroupName(gk);
        filteredList.appendChild(gh);
      }
    }

    var h = document.createElement("span");
    h.className = "fhost";
    h.textContent = fr.host;
    row.appendChild(h);
    if (fr.v.catId != null) {

      b.title = "Mark this category blocked / allowed at your school";
      b.addEventListener("click", onCatClick);
      row.appendChild(b);
    } else if (SOFT_VIAS[fr.v.via]) {
      var hb = document.createElement("button");
      hb.type = "button";
      hb.className = "fwhy cat";
      hb.textContent = whyText(fr.v);
      hb.title = "This one couldn't be measured — decide it yourself";
      hb.addEventListener("click", onHostClick);
      row.appendChild(hb);
    } else {
      var w = document.createElement("span");
      w.className = "fwhy";
      w.textContent = whyText(fr.v);
      row.appendChild(w);
    }
    filteredList.appendChild(row);
  });
}

function onCatClick(ev) {
  ev.preventDefault();
  ev.stopPropagation();
  var carrier = ev.currentTarget;
  var host = null;
  if (carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("frow")) {
    var fh = carrier.parentNode.querySelector(".fhost");
    host = fh ? fh.textContent : null;
  } else if (carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("item")) {
    host = carrier.parentNode.querySelector(".host").textContent;
  }
  var fr = null, v = null;
  if (host) {
    for (var i = 0; i < filteredRows.length; i++) {
      if (filteredRows[i].host === host) { fr = filteredRows[i]; break; }
    }
  }
  if (!fr && carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("item")) {
    var hostEl = carrier.parentNode.querySelector(".host");
    for (var j = 0; j < lastVerdicts.length; j++) {
      if (lastVerdicts[j].host === (hostEl ? hostEl.textContent : "")) {
        v = lastVerdicts[j].v;
        break;
      }
    }
  } else if (fr) {
    v = fr.v;
  }
  if (!v || v.catId == null) return;
  var was = catBlocked(+v.catId);
  catOverrides[String(+v.catId)] = was ? 1 : 0;
  saveCatOverrides();
  var name = (CAT[+v.catId] || CAT[0])[0];
  verdictEpoch++;
  hostCache.clear();
  scan('"' + name + '" marked ' + (was ? "allowed" : "blocked") +
       " at your school — rechecking…");
}

function onHostClick(ev) {
  ev.preventDefault();
  ev.stopPropagation();
  var carrier = ev.currentTarget;
  var host = null;
  if (carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("frow")) {
    var fh = carrier.parentNode.querySelector(".fhost");
    host = fh ? fh.textContent : null;
  } else if (carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("item")) {
    var he = carrier.parentNode.querySelector(".host");
    host = he ? he.textContent : null;
  }
  if (!host) return;
  var has = Object.prototype.hasOwnProperty.call(hostOverrides, host);
  var next;
  if (has) next = hostOverrides[host] === 1 ? 0 : 1;
  else next = rowMap.has(host) ? 0 : 1;
  hostOverrides[host] = next;
  saveHostOverrides();
  scan(host + " marked " + (next === 1 ? "unblocked" : "blocked") +
       " — rechecking…");
}


function resetScanUI() {
  list.textContent = "";
  list.style.display = "";
  rowMap = new Map();
  filteredRows = [];
  groupOf = new Map();
  showGroups = true;
  unblockedCount = 0;
  stateEmpty.style.display = "none";
  stateError.style.display = "none";
  filteredWrap.style.display = "none";
  filteredList.textContent = "";
  filteredList.classList.remove("open");

}

var lastVerdicts = [];

function removeUnblocked(host) {
  var rec = rowMap.get(host);
  if (!rec) return;
  var gk = groupKeyOf(host);
  if (rec.el && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
  rowMap.delete(host);
  refreshGroupCount(gk);
  unblockedCount = Math.max(0, unblockedCount - 1);
}

function applyVerdict(host, url, v) {
  v = overrideVerdict(host, v);
  lastVerdicts.push({ host: host, v: v });
  var rec = rowMap.get(host);
  if (v.state === "ok") {
    if (!rec) appendUnblocked(host, url, v);
    for (var i = filteredRows.length - 1; i >= 0; i--) {
      if (filteredRows[i].host === host) filteredRows.splice(i, 1);
    }
  } else {
    if (rec) removeUnblocked(host);
    var fr = null;
    for (var i = 0; i < filteredRows.length; i++) {
      if (filteredRows[i].host === host) { fr = filteredRows[i]; break; }
    }
    if (fr) fr.v = v;
    else filteredRows.push({ host: host, url: url, v: v });
  }
  refreshCountsUI();
}

function refreshCountsUI() {
  countNum.textContent = String(unblockedCount);
  footer.style.display = unblockedCount ? "" : "none";
  if (filteredRows.length) {
    filteredWrap.style.display = "";
    filteredNum.textContent = String(filteredRows.length);
    renderFiltered();
  } else {
    filteredWrap.style.display = "none";
    filteredList.textContent = "";
  }
  if (unblockedCount) {
    list.style.display = "";
    stateEmpty.style.display = "none";
  } else if (liveHeader.classList.contains("done")) {
    list.style.display = "none";
    stateEmpty.style.display = "";
  }
}

onVerdictUpdate = function (host, v) {
  var url = null;
  var rec = rowMap.get(host);
  if (rec) url = rec.url;
  if (!url) {
    for (var i = 0; i < filteredRows.length; i++) {
      if (filteredRows[i].host === host) { url = filteredRows[i].url; break; }
    }
  }
  if (!url) url = "https://" + host + "/";
  applyVerdict(host, url, v);
};

function scan(customLabel) {
  run++;
  var myRun = run;
  resetScanUI();
  lastVerdicts = [];
  secRelayLeft = SEC_RELAY_BUDGET;
  if (customLabel) setStatus(customLabel);
  if (BLOCKERS[currentBlocker] && BLOCKERS[currentBlocker].db) {
    connect().then(function () {}, function () {});
  }
  var post = currentPost === -1 ? null : posts[currentPost];
  gatherLinks(post).then(function (links) {
    if (myRun !== run) return;
    var hosts = [], seen = new Set();
    links.forEach(function (l) {
      if (l.host && !seen.has(l.host)) { seen.add(l.host); hosts.push({ host: l.host, url: l.url, group: l.group || "links" }); }
    });
    hosts.sort(function (a, b) {
      var ga = prettyGroupName(a.group).toLowerCase();
      var gb = prettyGroupName(b.group).toLowerCase();
      if (ga !== gb) return ga < gb ? -1 : 1;
      return a.host < b.host ? -1 : a.host > b.host ? 1 : 0;
    });
    hosts.forEach(function (h) { groupOf.set(h.host, h.group); });
    var gset = new Set();
    hosts.forEach(function (h) { gset.add(prettyGroupName(h.group).toLowerCase()); });
    showGroups = gset.size > 1;
    if (!hosts.length) { finishScan(myRun); return; }

    if (currentBlocker === "all") {
      setStatus("Showing every link — no checks…");
      hosts.forEach(function (h) { appendUnblocked(h.host, h.url, null); });
      liveCount.innerHTML = "<b>" + hosts.length + "</b> links";
      finishScan(myRun);
      return;
    }

    if (!customLabel) setStatus("Checking " + hosts.length + " links…");
    var settled = 0, total = hosts.length, active = 0, idx = 0;
    liveCount.innerHTML = "<b>0</b> of " + total;
    function pump() {
      if (myRun !== run) return;
      while (idx < hosts.length && active < HOST_PAR) {
        (function (h) {
          active++;
          checkHost(h.host, h.url).then(function (v) {
            active--;
            if (myRun !== run) return;
            settled++;
            liveCount.innerHTML = "<b>" + settled + "</b> of " + total;
            liveBar.style.width = Math.round(settled / total * 100) + "%";
            applyVerdict(h.host, h.url, v);
            if (settled === total) finishScan(myRun);
            pump();
          }, function () {
            active--;
            pump();
          });
        })(hosts[idx++]);
      }
    }
    pump();
  }, function () {
    if (myRun !== run) return;
    liveHeader.classList.add("done");
    stateError.style.display = "";
    list.style.display = "none";
  });
}

function finishScan(myRun) {
  if (myRun !== run) return;
  liveHeader.classList.add("done");
  countLabel.textContent = currentBlocker === "all" ? "links" : "unblocked";
  refreshCountsUI();
  try { store("ls19.lastscan", JSON.stringify({ d: Date.now(), u: unblockedCount, f: filteredRows.length, b: currentBlocker })); } catch (e) {}
  renderStartStats();
  redeemUnclear(myRun, 0);
  securlyProofPass(myRun);
}

function securlyProofPass(myRun) {
  if (myRun !== run || currentBlocker !== "securly" || blogspotBlocked !== true) return;
  var jobs = [];
  filteredRows.forEach(function (fr) {
    if (!fr.v || fr.v.state === "ok" || fr.v.via === "dead") return;
    if (!SOFT_VIAS[fr.v.via]) return;
    if (Object.prototype.hasOwnProperty.call(hostOverrides, fr.host)) return;
    var ic = iconCache.get(fr.host);
    if (!ic || ic.decoded || !ic.refused) return;
    jobs.push({ host: fr.host, url: fr.url, listed: false });
  });
  lastVerdicts.forEach(function (lv) {
    if (!lv || !lv.v || lv.v.via !== "answered") return;
    if (Object.prototype.hasOwnProperty.call(hostOverrides, lv.host)) return;
    var ic = iconCache.get(lv.host);
    if (!ic || ic.decoded || !ic.refused) return;
    var rec = rowMap.get(lv.host);
    jobs.push({ host: lv.host, url: (rec && rec.url) || ("https://" + lv.host + "/"), listed: true });
  });
  if (!jobs.length) return;
  var myEpoch = verdictEpoch;
  var idx = 0, active = 0, left = jobs.length;
  function doneOne() {
    left--;
    if (left > 0) pump();
  }
  function pump() {
    while (active < 2 && idx < jobs.length) {
      (function (j) {
        active++;
        securlyRelayCheck(j.host, j.url).then(function (sv) {
          active--;
          if (myRun !== run || myEpoch !== verdictEpoch) return;
          if (sv) {
            if (j.listed && sv.via !== "refuses") {
            } else {
              hostCache.set(j.host, sv);
              applyVerdict(j.host, j.url, sv);
            }
          }
          doneOne();
        }, function () { active--; doneOne(); });
      })(jobs[idx++]);
    }
  }
  pump();
}

function redeemUnclear(myRun, round) {
  if (myRun !== run || currentBlocker === "all" || round >= 2) return;
  var orphans = [];
  filteredRows.forEach(function (fr) {
    if (fr.v && (fr.v.via === "unverified" || fr.v.via === "unreachable" ||
                 fr.v.via === "dead")) orphans.push({ host: fr.host, url: fr.url });
  });
  if (!orphans.length) return;
  setTimeout(function () {
    if (myRun !== run) return;
    orphans.forEach(function (o) {
      checkHost(o.host, o.url, DB_PATIENCE_LONG).then(function (v) {
        if (myRun !== run) return;
        applyVerdict(o.host, o.url, v);
      });
    });
    redeemUnclear(myRun, round + 1);
  }, round === 0 ? 1500 : 15000);
}

function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
copyBtn.addEventListener("click", function () {
  var urls = [];
  Array.prototype.forEach.call(list.querySelectorAll(".item .host"), function (hEl) {
    var rec = rowMap.get(hEl.textContent);
    if (rec) urls.push(rec.url);
  });
  if (!urls.length) rowMap.forEach(function (r) { urls.push(r.url); });
  if (!urls.length) return;
  var text = urls.join("\n");
  function done() {
    copyBtnLabel.textContent = "Copied";
    setTimeout(function () { copyBtnLabel.textContent = "Copy URLs"; }, 1400);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () {
      if (legacyCopy(text)) done();
    });
  } else if (legacyCopy(text)) done();
});


function present(found) {
  presented = true;

  var saved = unstore("ls19.post");
  if (saved === "__all__") currentPost = -1;

      if (posts[i].url === saved) { currentPost = i; break; }
    }

  postBar.style.display = "";
  postTrigger.disabled = false;
  buildPostMenu();
  updatePostTrigger();
  scan();
}

function boot() {
  liveHeader.classList.remove("done");
  stateError.style.display = "none";
  setStatus("Looking through the latest post…");
  var netP = calibrateNet();
  var mirrorP = fetchPostsViaMirror();
  discoverPostsViaFeed().then(function (found) {
    blogBlocked = false;
    var ready = netP.then(function () { return calibrateIconTrust(); });
    Promise.race([ready, sleep(1500)]).then(function () { present(found); });
  }, function () {
    setStatus("The blog is blocked here — reading it through the relay…");
    fetchFeedViaRelay().then(function (found) {

        cp.appendChild(ci);
        cp.appendChild(el("div", "mv-castn", c.name || ""));
        cp.appendChild(el("div", "mv-castc", c.character || ""));
        cs.appendChild(cp);
      });
      detail.appendChild(cs);
    }
    if (isTv && j.seasons && j.seasons.length) {
      var ss = el("div", "mv-seasons");
      j.seasons.forEach(function (se) {
        if (se.season_number === 0) return;
        var row = el("button", "mv-seas");
        row.type = "button";
        row.appendChild(el("span", "mv-seasn", "Season " + se.season_number));
        var sm = el("span", "mv-seasmeta",
          (se.name || "").replace(/^Season\s*\d+\s*·?\s*/i, "") +
          " · " + (se.episode_count || "?") + " episodes" +
          (se.air_date ? " · " + se.air_date.slice(0, 4) : ""));
        row.appendChild(sm);
        var chev = el("span", "mv-seasarrow");
        chev.setAttribute("aria-hidden", "true");
        chev.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
        row.appendChild(chev);
        row.addEventListener("click", function () { loadSeason(id, se.season_number, title, se.episode_count || 0); });
        ss.appendChild(row);
      });
      detail.appendChild(ss);
    }
    showWallUI();
    wall.style.display = "none";
    stateEl.style.display = "none";
  }

  function wireCastImg(im, path) {
    var rungs = [
      function (p) { return "https://image.tmdb.org/t/p/w185" + p; },
      function (p) { return "https://cors.eu.org/https://image.tmdb.org/t/p/w185" + p; }
    ];
    var i = path ? 0 : rungs.length;
    im.onerror = function () {
      i++;
      if (i < rungs.length) { im.src = rungs[i](path); return; }
      im.onerror = null;
      im.src = CAST_FALLBACK;
    };
    if (path) im.src = rungs[0](path);
    else im.src = CAST_FALLBACK;
  }
  var CAST_FALLBACK = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="#f3f1e9"/><circle cx="30" cy="24" r="9" fill="#c8c2ad"/><rect x="14" y="38" width="32" height="14" rx="7" fill="#c8c2ad"/></svg>');

  function loadSeason(id, sn, title) {
    var key = id + "-" + sn;
    if (S.seasons[key]) { renderSeason(id, sn, title, S.seasons[key]); return; }
    showStateUI("Loading episodes…", false);
    tmdb("/tv/" + id + "/season/" + sn + "?language=en-US").then(function (j) {
      if (!j) { showStateUI("Can't reach episode data right now.", true); return; }
      S.seasons[key] = j;
      renderSeason(id, sn, title, j);
    });
  }

  function renderSeason(id, sn, title, j) {
    var eps = (j.episodes || []);
    detail.innerHTML = "";
    detail.appendChild(backBtn(title));
    var list = el("div", "mv-eps");
    eps.forEach(function (ep) {
      var row = el("div", "mv-ep");
      row.appendChild(el("div", "mv-epnum", "E" + ep.episode_number));
      var eb = el("div", "mv-epbody");
      eb.appendChild(el("div", "mv-epname", ep.name || "Episode " + ep.episode_number));
      eb.appendChild(el("div", "mv-epdate", ep.air_date || ""));
      row.appendChild(eb);
      var b = el("button", "mv-epp", "Play");
      b.type = "button";
      b.addEventListener("click", function () {
        play("tv", id, sn, ep.episode_number, title, eps.length);
      });
      row.appendChild(b);
      list.appendChild(row);
    });
    detail.appendChild(list);
    wall.style.display = "none";
    stateEl.style.display = "none";
    body.scrollTop = 0;
  }

  function play(k, id, s, e, title, eps) {
    PL = { k: k, id: id, s: s || 1, e: e || 1, t: title || "", eps: eps || 0, p: "" };
    if (!PL.p && lastPoster) PL.p = lastPoster;
    saveResume();
    body.style.display = "none";
    player.style.display = "flex";
    buildReelButtons();
    setReel(S.reel);
  }

  function buildReelButtons() {
    reelsEl.innerHTML = "";
    for (var i = 0; i < REELS.length; i++) {
      (function (ri) {
        var b = el("button", "g-pbtn mv-reel");
        b.type = "button";
        b.title = "Player: " + REELS[ri].n;
        b.textContent = REELS[ri].n;
        b.addEventListener("click", function () { setReel(ri); });
        reelsEl.appendChild(b);
      })(i);
    }
  }

  function setReel(ri) {
    if (ri < 0 || ri >= REELS.length) ri = 0;
    S.reel = ri;
    store("mv-reel", ri);
    try { frame.removeAttribute("srcdoc"); } catch (er) {}
    frame.src = REELS[ri][PL.k === "movie" ? "m" : "t"](PL.id, PL.s, PL.e);
    pname.textContent = PL.t;
    psub.textContent = PL.k === "tv" ? ("Season " + PL.s + " · Episode " + pad2(PL.e) + (PL.eps ? " of " + PL.eps : "")) : REELS[ri].n;
    var bs = reelsEl.getElementsByTagName("button");
    for (var i = 0; i < bs.length; i++) {
      bs[i].className = "g-pbtn" + (i === ri ? " mv-reel on" : " mv-reel");
      bs[i].title = "Player: " + REELS[i].n;
    }
    $("mvPrev").disabled = !(PL.k === "tv" && (PL.s > 1 || PL.e > 1));
    $("mvNext").disabled = !(PL.k === "tv" && (!PL.eps || PL.e < PL.eps));
  }

  function stepEp(d) {
    if (PL.k !== "tv") return;
    if (d < 0) {
      if (PL.e > 1) PL.e--;
      else if (PL.s > 1) { PL.s--; PL.e = 1; }
      else return;
    } else {
      if (!PL.eps || PL.e < PL.eps) PL.e++;
      else { PL.s++; PL.e = 1; }
    }
    saveResume();
    setReel(S.reel);
  }

  function closePlayer() {
    try { frame.srcdoc = ""; } catch (er) {}
    try { frame.removeAttribute("srcdoc"); } catch (er) {}
    frame.src = "about:blank";
    player.style.display = "none";
    body.style.display = "";
    renderResume();
  }

  function rebuild() {
    sigUpd();
    renderResume();
    if (player.style.display !== "none") return;
    if (S.view === "detail") {
      openDetail(PL.k, PL.id, PL.t);
      return;
    }
    if (S.mode === "search" && S.q) { loadSearch(S.q); return; }
    loadWall(true);
  }

  function mvStart() {
    if (wired) return;
    wired = true;
    TABS.forEach(function (t) {
      var id = "mvTab" + t.charAt(0).toUpperCase() + t.slice(1);
      $(id).addEventListener("click", function () {
        if (S.tab === t && S.mode === "tab") return;
        S.tab = t;
        S.mode = "tab";
        search.value = "";
        setTabUI(t);
        showWrap();
        loadWall(true);
      });
    });
    var deb = 0;
    search.addEventListener("input", function () {
      clearTimeout(deb);
      deb = setTimeout(function () {
        var q = search.value.trim();
        if (!q && S.mode !== "tab") { S.mode = "tab"; loadWall(true); return; }
        if (q) loadSearch(q);
      }, 350);
    });
    $("mvPrev").addEventListener("click", function () { stepEp(-1); });
    $("mvNext").addEventListener("click", function () { stepEp(1); });
    $("mvBack").addEventListener("click", closePlayer);
    $("mvFull").addEventListener("click", function () {
      try {
        var p = frame.requestFullscreen();
        if (p && p["catch"]) p["catch"](function () {});
      } catch (e) {}
    });
    buildReelButtons();
    retryBtn.addEventListener("click", function () { rethread(); });
    sig.addEventListener("click", function () { rethread(); });
    document.addEventListener("keydown", function (ev) {
      if (view.style.display === "none") return;
      var tag = (ev.target && ev.target.tagName) || "";
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
      if (ev.key === "Escape") {
        if (player.style.display !== "none") { closePlayer(); return; }
        if (S.view === "detail") { showWrap(); return; }
        return;
      }
      if (player.style.display !== "none") {
        if (ev.key === "ArrowLeft") { stepEp(-1); return; }
        if (ev.key === "ArrowRight") { stepEp(1); return; }
        if (!ev.ctrlKey && !ev.metaKey && !ev.altKey && /^[a-e]$/.test(ev.key)) {
          setReel("abcde".indexOf(ev.key));
          return;
        }
      }
      if (ev.key === "/") { ev.preventDefault(); search.focus(); }
    });
    var obs = new IntersectionObserver(function (ents) {
      if (ents[0] && ents[0].isIntersecting && S.view === "wall" && S.mode === "tab" && S.more && !S.loading) {
        loadWall(false);
      }
    }, { root: body, rootMargin: "600px" });
    obs.observe(more);
    setInterval(function () {
      if (S.dark && !document.hidden && view.style.display !== "none" && !revival) rethread();
    }, 45000);
    sigUpd();
    loadWall(true);
  }

  window.mvStart = mvStart;
})();
</script>

</html>
