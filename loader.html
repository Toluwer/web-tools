<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>·</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:#fff;font:12px/1.45 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
  #frame{width:100%;height:100%;border:0;background:#000}
  #fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#000;color:rgba(255,255,255,.6)}
  #fail b{display:block;color:#fff;font-weight:600;margin-bottom:6px}
</style>
</head>
<body>
<iframe id="frame" title="app" referrerpolicy="no-referrer" allow="fullscreen; autoplay"></iframe>
<div id="fail"><div><b>All routes failed</b>every host unreachable</div></div>
<script>
(function () {
  "use strict";
  var USER = "Toluwer", REPO = "web-tools";
  var APP = "WebTool.html";
  var RAW = "https://raw.githubusercontent.com/" + USER + "/" + REPO + "/main/" + APP;
  var PG  = "https://" + USER + ".github.io/" + REPO + "/" + APP;
  var JSD = "https://cdn.jsdelivr.net/gh/" + USER + "/" + REPO + "@main/" + APP;

  var frame = document.getElementById("frame");
  var fail = document.getElementById("fail");
  var run = 0;

  function bust(u) { return u + (u.indexOf("?") < 0 ? "?" : "&") + "v=" + run; }

  function fetchText(url, ms) {
    return new Promise(function (resolve, reject) {
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); reject(new Error("timeout")); }, ms || 8000);
      fetch(url, { signal: ctl.signal, cache: "no-store" })
        .then(function (r) {
          clearTimeout(timer);
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (txt) {
          clearTimeout(timer);
          if (txt.length < 500 || txt.toLowerCase().indexOf("<!doctype html") < 0 || txt.indexOf("startScreen") < 0) throw new Error("bad payload");
          resolve(txt);
        })
        .catch(function (e) { clearTimeout(timer); reject(e); });
    });
  }

  function useSrcdoc(txt) {
    frame.removeAttribute("src");
    frame.srcdoc = txt;
  }
  function useSrc(url) {
    frame.removeAttribute("srcdoc");
    frame.src = url;
  }

  function ladder() {
    run = Date.now();
    fail.style.display = "none";
    var steps = [
      { name: "raw",   run: function () { return fetchText(bust(RAW)).then(useSrcdoc); } },
      { name: "cdn",   run: function () { return fetchText(bust(JSD)).then(useSrcdoc); } },
      { name: "pages", run: function () { return fetchText(bust(PG), 9000).then(function () { useSrc(bust(PG)); }); } },
      { name: "pages · direct", run: function () {
        return new Promise(function (resolve, reject) {
          var t = setTimeout(function () { cleanup(); reject(new Error("no load")); }, 9000);
          function cleanup() { clearTimeout(t); frame.removeEventListener("load", onLoad); }
          function onLoad() {
            cleanup();
            try {
              var d = frame.contentDocument;
              if (d && d.getElementById("startScreen")) { resolve(); return; }
            } catch (e) {}
            reject(new Error("loaded but not the app"));
          }
          frame.addEventListener("load", onLoad);
          useSrc(bust(PG));
        });
      } }
    ];
    var i = 0;
    (function step() {
      if (i >= steps.length) {
        frame.removeAttribute("srcdoc");
        frame.removeAttribute("src");
        fail.style.display = "flex";
        return;
      }
      var s = steps[i++];
      s.run().then(function () {})["catch"](function () {
        step();
      });
    })();
  }

  ladder();
})();
</script>
</body>
</html>
