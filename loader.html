<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141414">
<title>Webtool</title>



<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:dark}
body{background:#141414;color:#f3f3f3;font:13px/1.6 'Segoe UI',Arial,sans-serif;overflow:hidden}
#wrap,#fail{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;background:#181818;text-align:center}
#ttl{font-size:23px;font-weight:600;letter-spacing:-.6px;color:#f3f3f3}
#sub,#fail span{font-size:13px;color:#969696;max-width:460px;line-height:1.8}
#sub b{color:#b5b5b5;font-weight:500}
#bar{width:300px;max-width:80vw;height:3px;background:#303030;border-radius:4px;overflow:hidden}
#fill{height:100%;width:0;background:#3b82f6;border-radius:4px;transition:width .25s}
#cred{font-size:11px;color:#777}#cred a{color:#969696;text-underline-offset:3px}
#fail{display:none}#fail>div{width:min(420px,100%);padding:30px;border:1px solid #303030;border-radius:20px;background:#232323}
#fail b{display:block;font-size:21px;font-weight:550;color:#f3f3f3;margin-bottom:10px}
#retry{font:600 12px 'Segoe UI',Arial,sans-serif;padding:10px 18px;background:#3b82f6;color:#fff;border:0;border-radius:999px;cursor:pointer;margin-top:8px}
#retry:hover{background:#4d8df7}#retry:focus-visible,a:focus-visible{outline:2px solid #3b82f6;outline-offset:4px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#181818;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#frame{display:block}
</style>
</head>
<body>
<iframe id="frame" title="app" referrerpolicy="no-referrer" allow="fullscreen; autoplay"></iframe>
<div id="fail"><div><b>Unable to load Webtool</b><span>The available hosts could not be reached. Check your connection, then try again.</span><br><button id="retry" type="button">Try again</button></div></div>
<script>
(function () {
  "use strict";
  var USER = "Toluwer", REPO = "web-tools";
  var APP = "WebTool.html";
  var RAW = "https://raw.githubusercontent.com/" + USER + "/" + REPO + "/main/" + APP;
  var PG  = "https://" + USER + ".github.io/" + REPO + "/" + APP;
  var JSD = "https://cdn.jsdelivr.net/gh/" + USER + "/" + REPO + "@main/" + APP;

  var frame = document.getElementById("frame");
  var fail = document.getElementById("fail");
  var run = 0;

  function bust(u) { return u + (u.indexOf("?") < 0 ? "?" : "&") + "v=" + run; }

  function fetchText(url, ms) {
    return new Promise(function (resolve, reject) {
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); reject(new Error("timeout")); }, ms || 8000);
      fetch(url, { signal: ctl.signal, cache: "no-store" })
        .then(function (r) {
          clearTimeout(timer);
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (txt) {
          clearTimeout(timer);
          if (txt.length < 500 || txt.toLowerCase().indexOf("<!doctype html") < 0 || txt.indexOf("startScreen") < 0) throw new Error("bad payload");
          resolve(txt);
        })
        .catch(function (e) { clearTimeout(timer); reject(e); });
    });
  }

  function useSrcdoc(txt) {
    frame.removeAttribute("src");
    frame.srcdoc = txt;
  }
  function useSrc(url) {
    frame.removeAttribute("srcdoc");
    frame.src = url;
  }

  function ladder() {
    run = Date.now();
    fail.style.display = "none";
    var steps = [
      { name: "raw",   run: function () { return fetchText(bust(RAW)).then(useSrcdoc); } },
      { name: "cdn",   run: function () { return fetchText(bust(JSD)).then(useSrcdoc); } },
      { name: "pages", run: function () { return fetchText(bust(PG), 9000).then(function () { useSrc(bust(PG)); }); } },
      { name: "pages · direct", run: function () {
        return new Promise(function (resolve, reject) {
          var t = setTimeout(function () { cleanup(); reject(new Error("no load")); }, 9000);
          function cleanup() { clearTimeout(t); frame.removeEventListener("load", onLoad); }
          function onLoad() {
            cleanup();
            try {
              var d = frame.contentDocument;
              if (d && d.getElementById("startScreen")) { resolve(); return; }
            } catch (e) {}
            reject(new Error("loaded but not the app"));
          }
          frame.addEventListener("load", onLoad);
          useSrc(bust(PG));
        });
      } }
    ];
    var i = 0;
    (function step() {
      if (i >= steps.length) {
        frame.removeAttribute("srcdoc");
        frame.removeAttribute("src");
        fail.style.display = "flex";
        return;
      }
      var s = steps[i++];
      s.run().then(function () {})["catch"](function () {
        step();
      });
    })();
  }

  document.getElementById("retry").addEventListener("click", ladder);
  ladder();
})();
</script>
</body>
</html>
