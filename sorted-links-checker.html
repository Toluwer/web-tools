<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f5f1">
<title>·</title>
<style>

  :root {
    --bg:        #f5f4ef;
    --bg-grad:   #efece4;
    --surface:   #ffffff;
    --surface-2: #faf9f5;
    --ink:       #161616;
    --ink-soft:  #4a4a48;
    --muted:     #86857e;
    --faint:     #b5b3aa;
    --line:        #ece9df;
    --line-soft:   #f3f1e9;
    --line-strong: #c8c2ad;   
    --accent:    #161616;
    --green:     #2f7d4f;
    --green-soft:#e8f1ea;
    --green-line:#cfe3d3;
    --red:       #b3403a;
    --radius:    12px;
    --radius-sm: 10px;
    --shadow:    0 1px 2px rgba(20, 18, 12, 0.04),
                 0 12px 36px rgba(20, 18, 12, 0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), transparent 70%);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: visible;            
    position: relative;
    min-height: 220px;
    display: flex;
    flex-direction: column;
  }

  .live-header {
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity .45s ease, max-height .45s ease, padding .45s ease, border-color .45s ease;
    max-height: 200px;
    overflow: hidden;
  }
  .live-header.done {
    opacity: 0;
    max-height: 0;
    padding-top: 0; padding-bottom: 0;
    border-color: transparent;
    pointer-events: none;
  }

  .live-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .live-label {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: -0.005em;
  }

  .dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    height: 14px;
  }
  .dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.2;
    animation: dotPulse 1.4s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotPulse {
    0%, 70%, 100% { opacity: 0.2; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-2px); }
  }
  .live-header.done .dots span { animation: none; }

  .live-count {
    font-size: 12.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .live-count b { color: var(--ink-soft); font-weight: 600; }

  .live-track {
    height: 2px;
    background: var(--line-soft);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .live-bar {
    height: 100%;
    width: 0%;
    background: var(--ink);
    border-radius: 999px;
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }

  .list {
    flex: 1;
    padding: 6px 8px;
    overflow-y: auto;
    max-height: 60vh;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  .item {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    color: inherit;
    transition: background .14s ease;
    animation: itemIn .42s cubic-bezier(.21,.8,.35,1) both;
  }
  .item:hover { background: var(--surface-2); }
  .item:active { background: var(--line-soft); }
  @keyframes itemIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .check {
    flex-shrink: 0;
    width: 19px; height: 19px;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--green-line);
  }
  .check svg { width: 10px; height: 10px; stroke-width: 3; }

  .host {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 13.5px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }

  .arrow {
    flex-shrink: 0;
    color: var(--faint);
    transition: color .14s ease, transform .14s ease;
    display: flex;
    align-items: center;
  }
  .item:hover .arrow {
    color: var(--ink);
    transform: translateX(2px);
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--line-soft);
    gap: 12px;
  }
  .count {
    font-size: 12.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    letter-spacing: 0.005em;
  }
  .count b { color: var(--ink); font-weight: 600; }

  .copy-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 9px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s, border-color .14s, color .14s;
  }
  .copy-btn:hover {
    background: var(--surface-2);
    border-color: var(--line);
    color: var(--ink);
  }
  .copy-btn:active { transform: translateY(0.5px); }
  .copy-btn:disabled { opacity: .45; cursor: not-allowed; }

  .state-empty, .state-error {
    padding: 56px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .state-empty .glyph, .state-error .glyph {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
    color: var(--faint);
  }
  .state-empty .msg, .state-error .msg {
    font-size: 14.5px;
    color: var(--ink-soft);
    letter-spacing: -0.005em;
  }
  .state-empty .sub, .state-error .sub {
    font-size: 12.5px;
    color: var(--faint);
  }
  .retry-btn {
    margin-top: 14px;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 9px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .14s;
  }
  .retry-btn:hover { background: #2a2a2a; }

  .blocker-bar {
    position: relative;
    padding: 14px 16px 0;
    flex-shrink: 0;
  }
  .blocker-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    transition: background .14s, border-color .14s;
    min-height: 46px;
  }
  .blocker-trigger:hover:not(:disabled) { background: var(--surface-2); }
  .blocker-trigger:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .blocker-trigger:disabled { opacity: .55; cursor: not-allowed; }

  .blocker-trigger-logo {
    flex-shrink: 0;
    width: 88px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .blocker-trigger-logo img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
  }
  .blocker-trigger-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .blocker-trigger-chev {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: var(--muted);
    transition: transform .18s ease;
  }
  .blocker-trigger[aria-expanded="true"] .blocker-trigger-chev { transform: rotate(180deg); }

  .blocker-menu {
    position: absolute;
    top: calc(100% + 6px);
    max-height: 360px;
    overflow-y: auto;
    scrollbar-width: thin;
    left: 16px;
    right: 16px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(20, 18, 12, 0.06),
      0 12px 36px rgba(20, 18, 12, 0.14);
    max-height: 262px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    padding: 5px;
    z-index: 60;             
    animation: menuIn .18s cubic-bezier(.21,.8,.35,1) both;
    transform-origin: top center;
  }
  .blocker-menu[hidden] { display: none; }
  .blocker-menu::-webkit-scrollbar { width: 6px; }
  .blocker-menu::-webkit-scrollbar-track { background: transparent; }
  .blocker-menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  .blocker-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--ink);
    font-size: 13.5px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background .12s ease;
  }
  .blocker-option:hover { background: var(--surface-2); }
  .blocker-option:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .blocker-option[aria-selected="true"] { background: var(--green-soft); }

  .blocker-option-mark {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    opacity: 0;
  }
  .blocker-option[aria-selected="true"] .blocker-option-mark { opacity: 1; }

  .blocker-option-logo {
    flex-shrink: 0;
    width: 96px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .blocker-option-logo img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .blocker-option-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .blocker-option-name {
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.005em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .blocker-option-desc {
    font-size: 11.5px;
    color: var(--faint);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .blocker-option[aria-selected="true"] .blocker-option-name { color: var(--green); }
  .blocker-option[aria-selected="true"] .blocker-option-desc { color: var(--green); }

  .post-bar {
    position: relative;
    padding: 14px 16px 0;
    flex-shrink: 0;
  }

  .post-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    transition: background .14s, border-color .14s;
    min-height: 44px;
  }
  .post-trigger:hover:not(:disabled) { background: var(--surface); border-color: var(--line-strong); }
  .post-trigger:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .post-trigger:disabled { opacity: .55; cursor: not-allowed; }

  .post-trigger-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .post-trigger-date {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .post-trigger-chev {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    color: var(--muted);
    transition: transform .18s ease;
  }
  .post-trigger[aria-expanded="true"] .post-trigger-chev { transform: rotate(180deg); }

  .post-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 16px;
    right: 16px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(20, 18, 12, 0.06),
      0 12px 36px rgba(20, 18, 12, 0.14);
    max-height: 320px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    padding: 5px;
    z-index: 50;
    animation: menuIn .18s cubic-bezier(.21,.8,.35,1) both;
    transform-origin: top center;
  }
  .post-menu[hidden] { display: none; }
  .post-menu::-webkit-scrollbar { width: 6px; }
  .post-menu::-webkit-scrollbar-track { background: transparent; }
  .post-menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-4px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .post-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--ink);
    font-size: 13.5px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    transition: background .12s ease;
  }
  .post-option:hover { background: var(--surface-2); }
  .post-option:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .post-option[aria-selected="true"] { background: var(--green-soft); }

  .post-option-mark {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    opacity: 0;
  }
  .post-option[aria-selected="true"] .post-option-mark { opacity: 1; }

  .post-option-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .post-option-date {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .post-option[aria-selected="true"] .post-option-date { color: var(--green); }

  @media (max-width: 560px) {
    body { padding: 16px 14px; }
    .container { max-width: 100%; border-radius: 12px; }
    .live-header { padding: 18px 18px 14px; }
    .blocker-bar { padding: 12px 12px 0; }
    .blocker-menu { left: 12px; right: 12px; }
    .post-bar { padding: 12px 12px 0; }
    .post-menu { left: 12px; right: 12px; }
    .item { padding: 11px 12px; gap: 11px; }
    .footer { padding: 12px 14px 14px; }
    .list { max-height: 55vh; }
  }

  /* ---- additions in the tool's own language ----------------------------------
     A faint category note on listed rows (clickable — flips this school's
     policy), and the quiet "filtered out" expander under the list. */

  .item .why-cat {
    flex-shrink: 1;
    min-width: 0;
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--faint);
    letter-spacing: 0;
    cursor: pointer;
    border-bottom: 1px dotted var(--line-strong);
    transition: color .14s ease, border-color .14s ease;
  }
  .item .why-cat:hover { color: var(--ink-soft); border-bottom-color: var(--muted); }

  .filtered {
    border-top: 1px solid var(--line-soft);
    padding: 0 16px;
    flex-shrink: 0;
  }
  .filtered-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 0 4px;
    background: none;
    border: none;
    font: inherit;
    font-size: 12.5px;
    color: var(--faint);
    cursor: pointer;
    transition: color .14s ease;
  }
  .filtered-toggle:hover { color: var(--muted); }
  .filtered-toggle b {
    color: var(--muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .filtered-toggle .chev { display: flex; transition: transform .18s ease; }
  .filtered-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .filtered-list { padding: 2px 0 12px; display: none; }
  .filtered-list.open { display: block; }

  .frow {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 10px;
    transition: background .14s ease;
  }
  .frow:hover { background: var(--surface-2); }
  .frow .fhost {
    flex: 1;
    min-width: 0;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }
  .frow .fwhy {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--faint);
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  button.fwhy.cat {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px dotted var(--line-strong);
    cursor: pointer;
    transition: color .14s ease, border-color .14s ease;
  }
  button.fwhy.cat:hover { color: var(--ink); border-bottom-color: var(--muted); }

  @media (max-width: 560px) {
    .filtered { padding: 0 14px; }
    .item .why-cat { display: none; }
    .frow .fwhy { max-width: 52%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item, .blocker-menu, .post-menu { animation: none; }
    .dots span { animation: none; opacity: .5; }
  }
</style>
</head>
<body>
  <div class="container" id="container">

    <div class="blocker-bar" id="blockerBar">
      <button class="blocker-trigger" id="blockerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="blocker-trigger-logo" id="blockerTriggerLogo">
          <img id="blockerTriggerLogoImg" alt="" src="" />
        </span>
        <span class="blocker-trigger-text" id="blockerTriggerText">Lightspeed Systems</span>
        <span class="blocker-trigger-chev" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
      <div class="blocker-menu" id="blockerMenu" role="listbox" hidden></div>
    </div>

    <div class="post-bar" id="postBar" style="display:none">
      <button class="post-trigger" id="postTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" disabled>
        <span class="post-trigger-text" id="postTriggerText">Latest post</span>
        <span class="post-trigger-date" id="postTriggerDate"></span>
        <span class="post-trigger-chev" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
      <div class="post-menu" id="postMenu" role="listbox" hidden></div>
    </div>

    <div class="live-header" id="liveHeader">
      <div class="live-row">
        <span class="live-label">
          <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span id="liveLabel">Looking through the latest post…</span>
        </span>
        <span class="live-count" id="liveCount"></span>
      </div>
      <div class="live-track"><div class="live-bar" id="liveBar"></div></div>
    </div>

    <div class="list" id="list"></div>

    <div class="filtered" id="filteredWrap" style="display:none">
      <button class="filtered-toggle" id="filteredToggle" type="button" aria-expanded="false">

            var url = pm[2] + pm[4] + pm[6];
            var host = hostOf(url);
            var key = gName + "|" + host;
            if (validHost(host) && !seen.has(key)) {
              seen.add(key);
              links.push({ url: url, host: host, group: gName });
            }
          }
        }
      }
    }
    if (!links.length) {
      var re = /https?:\/\/[^\s<>"'\\)\]]+/gi;
      var m;
      while ((m = re.exec(html)) !== null) {
        var u2 = m[0].replace(/[.,;]+$/, "");
        var h2 = hostOf(u2);
        if (validHost(h2) && !seen.has(h2)) {
          seen.add(h2);
          links.push({ url: u2, host: h2, group: "links" });
        }
      }
    }
    return links;
  }

  /* ---- lightspeed's own filter database --------------------------------------
     dy_lookup over the production WS is the same channel the school's filter
     agents use: it answers with the category THIS customer's policy applies
     to a host. It is only consulted when the browser itself couldn't prove
     anything (no icon decoded, no fingerprint matched) — and a hiccuping
     socket no longer poisons the scan: lookups retry through a short
     blackout, and a redemption pass re-asks anything that filtered out for
     lack of proof once the socket answers again. */

  var socket = null;
  var connected = false;
  var connecting = null;
  var pending = new Map();
  var dbInflight = new Map();
  var dbCache = new Map();
  var lsDeadUntil = 0;

  function teardown(reason) {
    connected = false;
    socket = null;
    pending.forEach(function (entry) {
      clearTimeout(entry.timer);
      entry.reject(new Error(reason || "connection closed"));
    });
    pending.clear();
  }

  function connect() {
    if (connected && socket && socket.readyState === 1) return Promise.resolve(socket);
    if (connecting) return connecting;
    if (Date.now() < lsDeadUntil) return Promise.reject(new Error("lightspeed unreachable"));

    connecting = new Promise(function (resolve, reject) {
      var ws;
      try { ws = new WebSocket(LS_WS_URL); }
      catch (e) { connecting = null; lsDeadUntil = Date.now() + 4000; return reject(e); }

      var timer = setTimeout(function () {
        try { ws.close(); } catch (e) {}
        connecting = null;
        lsDeadUntil = Date.now() + 4000;
        reject(new Error("Connection timed out"));
      }, 10000);

      ws.onopen = function () {
        clearTimeout(timer);
        socket = ws;
        connected = true;
        connecting = null;
        resolve(ws);
      };
      ws.onerror = function () {
        clearTimeout(timer);
        var wasConnecting = !!connecting;
        connecting = null;
        if (wasConnecting) { lsDeadUntil = Date.now() + 4000; reject(new Error("Could not reach Lightspeed")); }
        teardown("connection error");
      };
      ws.onclose = function () {
        clearTimeout(timer);
        var wasConnecting = !!connecting;
        connecting = null;
        if (wasConnecting) { lsDeadUntil = Date.now() + 4000; reject(new Error("Connection refused")); }
        teardown("connection closed");
      };
      ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(typeof ev.data === "string" ? ev.data : String(ev.data)); }
        catch (e) { return; }

        var host = (msg && msg.request && typeof msg.request.host === "string") ? msg.request.host : null;
        if (host === null && msg && typeof msg.host === "string") host = msg.host;
        if (host === null || !pending.has(host)) return;

        var entry = pending.get(host);
        if (typeof msg.cat === "number") {
          pending.delete(host);
          clearTimeout(entry.timer);
          entry.resolve({ cat: msg.cat });
        } else if (msg.status === 500) {
          if (entry.retries < 1) {
            entry.retries++;
            try {
              ws.send(JSON.stringify({ action: "dy_lookup", host: host, ip: LS_IP, customerId: LS_CUSTOMER }));
            } catch (e) {
              pending.delete(host); clearTimeout(entry.timer);
              entry.reject(new Error("send failed"));
            }
          } else {
            pending.delete(host);
            clearTimeout(entry.timer);
            entry.reject(new Error("Server rejected lookup"));
          }
        }
      };
    });
    return connecting;
  }

  function lookupOnce(host) {
    return new Promise(function (resolve, reject) {
      if (!socket || socket.readyState !== 1) { reject(new Error("Not connected")); return; }
      var entry = { resolve: resolve, reject: reject, retries: 0, timer: null };
      function fail(e) {
        pending.delete(host);
        clearTimeout(entry.timer);
        reject(e || new Error("Lookup failed"));
      }
      function send() {
        try {
          socket.send(JSON.stringify({ action: "dy_lookup", host: host, ip: LS_IP, customerId: LS_CUSTOMER }));
        } catch (e) { fail(e); }
      }
      function onTimeout() {
        if (entry.retries < 1 && socket && socket.readyState === 1) {
          entry.retries++;
          entry.timer = setTimeout(onTimeout, LOOKUP_TIMEOUT);
          send();
        } else {
          fail(new Error("Timed out"));
        }
      }
      entry.timer = setTimeout(onTimeout, LOOKUP_TIMEOUT);
      pending.set(host, entry);
      send();
    });
  }

  function lookup(host, attempt, started, patience) {
    attempt = attempt || 0;
    started = started || Date.now();
    patience = patience || DB_PATIENCE;
    if (dbCache.has(host)) return Promise.resolve(dbCache.get(host));
    if (dbInflight.has(host)) return dbInflight.get(host);
    var p = lookupOnce(host).then(function (v) {
      dbCache.set(host, v);
      dbInflight.delete(host);
      return v;
    }, function (e) {
      dbInflight.delete(host);
      var msg = (e && e.message) || "";
      if (attempt < 24 && Date.now() - started < patience &&
          (msg === "Not connected" || msg === "connection closed" ||
           msg === "connection error" || msg === "send failed" ||
           msg === "lightspeed unreachable" || msg === "Connection timed out" ||
           msg === "Could not reach Lightspeed" || msg === "Connection refused")) {
        /* the socket hiccuped — wait out the short blackout, then try the
           connection again while the wave (or redemption pass) still cares */
        return sleep(1000).then(function () {
          return connect().then(function () {}, function () {});
        }).then(function () {
          return lookup(host, attempt + 1, started, patience);
        });
      }
      throw e;
    });
    dbInflight.set(host, p);
    return p;
  }

  /* ---- the engine -------------------------------------------------------------
     One question per host: what actually happens when THIS browser touches it?
     Every fact is measured in ONE parallel wave — the page scan, the local
     icon decode and the filter DB all run at once, nothing waits in line:
       1. readable answer carrying the selected blocker's fingerprints
                                                     -> Blocked, measured.
          readable and clean of every fingerprint    -> Unblocked, measured.
       2. an icon the host serves decodes HERE       -> Unblocked, verified.
          (when the media-bypass canary has fired, icons prove nothing)
       3. icons actively refused HERE (an answer, not a timeout): ONE relay
          read of the same favicon decides — a genuine image is alive out
          there                                   -> Blocked, "Site Live,
                                                          Blocked Here".
          a favicon 403/410 proves nothing (S3 403s every missing key) —
          the link ITSELF is read once: refused to everyone -> Blocked,
          "Site Refuses". A timed-out icon is a slow host, never proof.
       4. still unproven: the page-asset two-sided check, then (Lightspeed
          mode) the school's own filter database — which may only ever say
          Blocked for near-universally filtered categories, else Unverified.
       5. last: does the connection itself survive?  A dead line filters out
          as "No Connection" (never claimed Blocked — this filter answers
          with a block page, it does not drop), an answering host with no
          proof stays honestly Unverified. */

  var hostCache = new Map();
  var hostInflight = new Map();
  var iconCache = new Map();
  var fpCache = new Map();

  var currentBlocker = "lightspeed";
  var verdictEpoch = 0;   // bumped when the blocker changes — verdicts are blocker-specific

  /* One icon probe with a three-way outcome: "hit" (bytes decoded), "error"
     (someone ANSWERED with a non-image — an active refusal, fast), or
     "timeout" (nobody answered in time — a slow or silently-dropping host).
     Only an active refusal may combine with a relay-confirmed image into a
     Blocked verdict; a timeout proves nothing either way. */
  function probeIconResult(url, ms, noBust) {
    return new Promise(function (resolve) {
      var img = new Image();
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        img.onload = img.onerror = null;
        img.src = "";
        resolve("timeout");
      }, ms);
      img.onload = function () {
        if (done) return;
        done = true; clearTimeout(timer); resolve("hit");
      };
      img.onerror = function () {
        if (done) return;
        done = true; clearTimeout(timer); resolve("error");
      };
      img.referrerPolicy = "no-referrer";
      img.src = noBust ? url : bust(url);
    });
  }

  function probeIcon(url, ms, noBust) {
    return probeIconResult(url, ms, noBust).then(function (r) { return r === "hit"; });
  }

  /* The icon wave: every candidate fires at once, the first decode settles
     it, and the outcome records whether anything was actively refused. */
  function tryIconUrls(urls) {
    return new Promise(function (resolve) {
      var left = urls.length;
      var out = { decoded: false, refused: false };
      if (!left) { resolve(out); return; }
      urls.forEach(function (u) {
        probeIconResult(u, ICON_TIMEOUT).then(function (r) {
          if (r === "hit") { out.decoded = true; resolve(out); }
          else {
            if (r === "error") out.refused = true;
            if (!out.decoded && --left === 0) resolve(out);
          }
        });
      });
    });
  }

  function anyIcon(host) {
    var urls = ICON_PATHS.map(function (p) { return "https://" + host + "/" + p; });
    if (host.indexOf("www.") !== 0) {
      WWW_ICON_PATHS.forEach(function (p) { urls.push("https://www." + host + "/" + p); });
    }
    return tryIconUrls(urls);   // one wave — the first icon to decode settles it
  }

  function anyIconCached(host) {
    if (iconCache.has(host)) return Promise.resolve(iconCache.get(host));
    return anyIcon(host).then(function (v) {
      iconCache.set(host, v);
      return v;
    });
  }

  /* Readable-response scan. Tries the actual link URL first, then the host
     root. When a response IS readable, the origin itself answered with CORS
     permission — a filter block page never does — so a vendor fingerprint
     inside it is proof the filter answered (Blocked), and a clean readable
     body is proof the real page loaded here (Unblocked). Result is a cached
     per-host fact, independent of the selected blocker. */
  function fpScan(host, repUrl) {
    if (fpCache.has(host)) return Promise.resolve(fpCache.get(host));
    var targets = [];
    if (repUrl && repUrl.indexOf("https://" + host + "/") === 0) targets.push(repUrl);
    targets.push("https://" + host + "/");
    var p = Promise.all(targets.map(function (u, i) {
      return withTimeout(function (sig) {
        return fetch(i === 0 ? u : bust(u), {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          redirect: "follow",
          credentials: "omit",
          signal: sig
        }).then(function (r) { return r.text(); });
      }, FP_TIMEOUT).catch(function () { return null; });
    })).then(function (bodies) {
      var out = { readable: false, fp: null };
      for (var i = 0; i < bodies.length; i++) {
        var txt = bodies[i];
        if (txt == null) continue;
        var head = String(txt).slice(0, 8000).toLowerCase();
        for (var j = 0; j < FP_LIST.length; j++) {
          if (head.indexOf(FP_LIST[j]) !== -1) {
            fpCache.set(host, { readable: true, fp: FP_LIST[j] });
            return { readable: true, fp: FP_LIST[j] };
          }
        }
        out.readable = true;              // readable and clean of every fingerprint
      }
      fpCache.set(host, out);
      return out;
    });
    fpCache.set(host, p);
    return p;
  }

  function probeConnection(host, attempt) {
    attempt = attempt || 0;
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, CONN_TIMEOUT);
    return fetch(bust("https://" + host + "/"), {
      method: "GET",
      mode: "no-cors",
      cache: "no-store",
      redirect: "follow",
      credentials: "omit",
      signal: ctrl ? ctrl.signal : undefined
    }).then(function () {
      clearTimeout(timer);
      return true;
    }).catch(function () {
      clearTimeout(timer);
      if (attempt < 1) {
        return sleep(400).then(function () { return probeConnection(host, attempt + 1); });
      }
      return false;
    });
  }

  /* DNS-over-HTTPS: does this domain exist at all on the open internet?
     Separates "the filter drops it" from "the domain is simply dead". */
  var dohCache = new Map();
  function domainResolves(host) {
    if (dohCache.has(host)) return Promise.resolve(dohCache.get(host));
    var p = fetch("https://dns.google/resolve?name=" + encodeURIComponent(host) + "&type=A", {
      cache: "no-store"
    }).then(function (r) { return r.json(); })
      .then(function (d) { return !!(d && d.Status === 0 && d.Answer && d.Answer.length); })
      .catch(function () {
        return fetch("https://cloudflare-dns.com/dns-query?name=" + encodeURIComponent(host) + "&type=A", {
          headers: { accept: "application/dns-json" }, cache: "no-store"
        }).then(function (r) { return r.json(); })
          .then(function (d) { return !!(d && d.Status === 0 && d.Answer && d.Answer.length); })
          .catch(function () { return null; });   // DoH unreachable — caller keeps the safe default
      });
    dohCache.set(host, p);
    return p;
  }

  function fallbackVerdict(host) {
    return probeConnection(host).then(function (up) {
      if (up) return { state: "unknown", via: "unverified" };
      return domainResolves(host).then(function (resolves) {
        if (resolves === false) return { state: "unknown", via: "dead" };
        /* a silent drop is NOT this filter's signature — it answers blocked
           hosts with a block page. Filtered, but never claimed Blocked. */
        return { state: "unknown", via: "unreachable" };
      });
    });
  }

  /* ---- media-bypass canary ----------------------------------------------------
     The blog host is measured at boot: if its own feed loads it is unblocked;
     if the feed fails but the relay reads it, it is filtered HERE. When a
     known-filtered host still serves a decodable icon, image requests bypass
     the filter — icon decode can no longer prove a page opens. */

  var iconTrust = true;
  var blogBlocked = null;
  var canaryNote = "";

  function calibrateIconTrust() {
    if (blogBlocked !== true) return Promise.resolve();
    return anyIcon(BLOG_HOST).then(function (r) {
      if (r && r.decoded) {
        iconTrust = false;
        canaryNote = "This network serves images for blocked sites, so icon checks are disabled — Unblocked now requires a measured page load.";
      }
    }, function () {});
  }


  /* Verdicts settle the moment anything proves them — an allowed-category
     link shows up after a short window for a readable block page to veto,
     measured proofs (a loaded page, a decoded icon) settle instantly, and a
     blocked-category verdict waits the wave out so a late icon can still
     rescue it. When the last fact lands, an authoritative pass reconciles
     anything the fast paths got wrong. */
  var onVerdictUpdate = null;   /* glue hooks in to reconcile the visible list */

  function checkHost(host, repUrl, dbPatience) {
    var myEpoch = verdictEpoch;
    if (hostCache.has(host)) return Promise.resolve(hostCache.get(host));
    var infl = hostInflight.get(host);
    if (infl && infl.epoch === myEpoch) return infl.p;
    var entry = null;
    var p = new Promise(function (resolve) {
      var done = false;
      var early = null;
      function settle(v) {
        if (done) return v;
        done = true;
        early = v;
        resolve(v);
        return v;
      }
      var t0 = Date.now();
      var pageP = fpScan(host, repUrl);
      var iconP = anyIconCached(host);
      var dbP = (BLOCKERS[currentBlocker] && BLOCKERS[currentBlocker].db)
        ? lookup(host, 0, 0, dbPatience || DB_PATIENCE).catch(function () { return null; })
        : Promise.resolve(null);

      function dbVerdict(db) {
        var cat = CAT[db.cat] || CAT[0];
        if (catBlocked(db.cat)) {
          return { state: "blocked", via: "db", cat: cat[0], catId: db.cat };
        }
        if (catAllowed(db.cat)) {
          return { state: "ok", via: "dbok", cat: cat[0], catId: db.cat };
        }
        return { state: "unknown", via: "cat", cat: cat[0], catId: db.cat };
      }

      function fromPage(page) {
        if (!(page && page.readable)) return null;
        if (page.fp) {
          return blockerHasFp(currentBlocker, page.fp)
            ? { state: "blocked", via: "fp" }
            : { state: "unknown", via: "conflict" };
        }
        return { state: "ok", via: "read" };
      }

      pageP.then(function (page) {
        if (myEpoch !== verdictEpoch) return;
        var v = fromPage(page);
        if (v) settle(v);
      });

      iconP.then(function (r) {
        if (myEpoch !== verdictEpoch) return;
        if (r && r.decoded && iconTrust) settle({ state: "ok", via: "verified" });
      });

      dbP.then(function (db) {
        if (myEpoch !== verdictEpoch || !db) return;
        var v = dbVerdict(db);
        if (v.state === "ok") {
          /* allowed-class lists fast — leaving a short window in which a
             readable block page still vetoes the category's word */
          var wait = Math.max(0, 1200 - (Date.now() - t0));
          setTimeout(function () {
            if (myEpoch !== verdictEpoch) return;
            settle(v);
          }, wait);
        } else {
          /* blocked / unknown wait the wave out: a late-decoding icon or a
             late-arriving readable page outranks the category both ways */
          Promise.all([pageP, iconP]).then(function () {
            if (myEpoch !== verdictEpoch) return;
            settle(v);
          });
        }
      });

      /* authoritative pass — reconciles anything settled early */
      Promise.all([pageP, iconP, dbP]).then(function (pair) {
        if (myEpoch !== verdictEpoch) return;
        var page = pair[0], iconR = pair[1], db = pair[2];
        var final = fromPage(page);
        if (!final && iconR && iconR.decoded && iconTrust) {
          final = { state: "ok", via: "verified" };
        }
        if (!final && db) final = dbVerdict(db);
        if (!final) {
          return fallbackVerdict(host).then(function (fv) {
            if (myEpoch !== verdictEpoch) return;
            settle(fv);
            if (early && fv && fv.state !== early.state && typeof onVerdictUpdate === "function") {
              onVerdictUpdate(host, fv);
            }
          });
        }
        if (settle(final) !== final) {
          /* settled earlier with something else */
          if (early && final.state !== early.state && typeof onVerdictUpdate === "function") {
            onVerdictUpdate(host, final);
          }
        }
      });
    });
    entry = { epoch: myEpoch, p: p };
    hostInflight.set(host, entry);
    p.then(function (v) {
      if (hostInflight.get(host) === entry) hostInflight.delete(host);
      /* fallback verdicts (nothing measured, DB silent) stay uncached — a
         later wave or the redemption pass re-asks once it recovers */
      if (myEpoch === verdictEpoch && v && v.via !== "unverified" &&
          v.via !== "unreachable" && v.via !== "dead") hostCache.set(host, v);
    }, function () {
      if (hostInflight.get(host) === entry) hostInflight.delete(host);
    });
    return p;
  }
  /* ---- discovery ------------------------------------------------------------ */

  function discoverPostsViaFeed() {
    return fetchFeedViaJsonp(FEED_MAX, FEED_TIMEOUT).then(function (data) {
      var entries = (data && data.feed && data.feed.entry) || [];
      var out = [];
      entries.forEach(function (e) {
        var alt = "";
        (e.link || []).forEach(function (l) { if (l.rel === "alternate") alt = l.href; });
        if (!alt) return;
        var title = (e.title && e.title.$t) || slugToTitle(alt);
        var date = (e.published && e.published.$t) || "";
        var content = (e.content && e.content.$t) || "";
        out.push({ title: title, date: date, url: alt,
          links: extractLinks(content), loaded: true });
      });
      if (!out.length) throw new Error("feed had no usable posts");
      return out;
    });
  }

  function present(found) {
    posts = found;
    postSel.textContent = "";
    var all = document.createElement("option");
    all.value = "__all__";
    all.textContent = "Every Post (All Links)";
    postSel.appendChild(all);
    posts.forEach(function (p, i) {
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = p.title + (p.date ? " (" + shortDate(p.date) + ")" : "");
      postSel.appendChild(o);
    });
    postSel.disabled = false;

    var saved = unstore("ls19.post");
    var idx = 0;
    if (saved === "__all__") idx = -1;
    else if (saved) {
      for (var i = 0; i < posts.length; i++) {
        if (posts[i].url === saved) { idx = i; break; }
      }
    }
    currentPost = idx;
    postSel.value = idx === -1 ? "__all__" : String(Math.max(idx, 0));
    scan();
  }

  function gatherAllLinks(onProgress) {
    var results = new Array(posts.length);
    var next = 0, done = 0;
    var PAR = 6;
    function readOne(p) {
      if (p.loaded) return Promise.resolve(p.links);
      onProgress(Math.min(done + PAR, posts.length), posts.length);
      return withTimeout(function (sig) { return fetchViaValidator(p.url, sig); }, VAL_TIMEOUT)
        .then(function (html) {
          p.links = extractLinks(html);
          p.loaded = true;
          return p.links;
        })
        .catch(function () { return []; });
    }
    function worker() {
      if (next >= posts.length) return Promise.resolve();
      var i = next++;
      return readOne(posts[i]).then(function (ls) {
        results[i] = ls;
        done++;
        return worker();
      });
    }
    var starters = [];
    for (var w = 0; w < Math.min(PAR, posts.length); w++) starters.push(worker());
    return Promise.all(starters).then(function () {
      var merged = [], seen = new Set();
      results.forEach(function (ls) {
        (ls || []).forEach(function (l) {
          var k = l.group + "|" + l.host;
          if (!seen.has(k)) { seen.add(k); merged.push(l); }
        });
      });
      return merged;
    });
  }

  function gatherLinks(post) {
    if (!post) {
      return gatherAllLinks(function (d, t) {
        setStatus("Reading every post — " + d + " of " + t + "…");
      });
    }
    if (post.loaded) return Promise.resolve(post.links || []);
    setStatus("Reading this post through the relay…");
    return withTimeout(function (sig) { return fetchViaValidator(post.url, sig); }, VAL_TIMEOUT)
      .then(function (html) {
        post.links = extractLinks(html);
        post.loaded = true;
        return post.links;
      })

/* ---- presentation — the original UI, restored ------------------------------
   One card, cream paper, blocker picker + post picker, a live header with
   pulsing dots, and a list of THE UNBLOCKED LINKS — that is the whole tool.
   The engine underneath stays measured: a link is listed when the real page
   loaded here, or its icon decoded, or the school's filter database puts it
   in an allowed category. Everything else folds into a quiet "filtered out"
   expander with its reason — and a category label you can click to correct
   your school's policy either way. */

var $ = function (id) { return document.getElementById(id); };
var blockerBar = $("blockerBar"), blockerTrigger = $("blockerTrigger"),
    blockerTriggerText = $("blockerTriggerText"), blockerTriggerLogoImg = $("blockerTriggerLogoImg"),
    blockerMenu = $("blockerMenu"), postBar = $("postBar"), postTrigger = $("postTrigger"),
    postTriggerText = $("postTriggerText"), postTriggerDate = $("postTriggerDate"),
    postMenu = $("postMenu"), liveHeader = $("liveHeader"), liveLabel = $("liveLabel"),
    liveCount = $("liveCount"), liveBar = $("liveBar"), list = $("list"),
    stateEmpty = $("stateEmpty"), stateError = $("stateError"), errorMsg = $("errorMsg"),
    retryBtn = $("retryBtn"), footer = $("footer"), countNum = $("countNum"),
    countLabel = $("countLabel"), copyBtn = $("copyBtn"), filteredWrap = $("filteredWrap"),
    filteredToggle = $("filteredToggle"), filteredNum = $("filteredNum"),
    filteredLabel = $("filteredLabel"), filteredList = $("filteredList");

var posts = [];
var currentPost = 0;      /* index into posts; -1 = every post */
var run = 0;              /* scan token — bumping it kills stale work */
var presented = false;
var rowMap = new Map();   /* host -> { url, why, catId } */
var filteredRows = [];    /* [{ host, v }] */
var unblockedCount = 0;

var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function shortDate(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  if (!m) return "";
  return MONTHS[+m[2] - 1] + " " + (+m[3]);
}
function setStatus(t) { liveLabel.textContent = t; }

/* ---- blocker picker -------------------------------------------------------- */

var BLOCKER_ORDER = [
  ["lightspeed", "Lightspeed Systems", "Live policy database — categories + verdicts"],
  ["securly", "Securly", "Block-page fingerprint scan"],
  ["goguardian", "GoGuardian", "Block-page fingerprint scan"],
  ["fortiguard", "FortiGuard", "Block-page fingerprint scan"],
  ["umbrella", "Cisco Umbrella", "Block-page fingerprint scan"],
  ["zscaler", "Zscaler", "Block-page fingerprint scan"],
  ["iboss", "iBoss", "Block-page fingerprint scan"],
  ["contentkeeper", "ContentKeeper", "Block-page fingerprint scan"],
  ["barracuda", "Barracuda", "Block-page fingerprint scan"],
  ["sophos", "Sophos", "Block-page fingerprint scan"],
  ["auto", "Auto-Detect", "Any filter's block page counts as proof"],
  ["all", "All Links", "Show every link in the post — no checks"]
];
var LOGO_FOR = { lightspeed: "lightspeed", fortiguard: "fortiguard", umbrella: "cisco",
                 securly: "securly", contentkeeper: "contentkeeper", all: "all" };

(function restoreBlocker() {
  var saved = unstore("ls19.blocker");
  if (!saved) return;
  for (var i = 0; i < BLOCKER_ORDER.length; i++) {
    if (BLOCKER_ORDER[i][0] === saved) { currentBlocker = saved; return; }
  }
})();

function setBlockerUI() {
  var entry = null;
  for (var i = 0; i < BLOCKER_ORDER.length; i++) {
    if (BLOCKER_ORDER[i][0] === currentBlocker) entry = BLOCKER_ORDER[i];
  }
  if (!entry) { currentBlocker = "lightspeed"; entry = BLOCKER_ORDER[0]; }
  blockerTriggerText.textContent = entry[1];
  var key = LOGO_FOR[currentBlocker];
  if (key && LOGOS[key]) {
    blockerTriggerLogoImg.src = LOGOS[key];
    blockerTriggerLogoImg.parentNode.style.display = "";
  } else {
    blockerTriggerLogoImg.parentNode.style.display = "none";
  }
}

function buildBlockerMenu() {
  blockerMenu.textContent = "";
  BLOCKER_ORDER.forEach(function (e) {
    var key = e[0], name = e[1], desc = e[2];
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "blocker-option";
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-selected", key === currentBlocker ? "true" : "false");
    var mark = document.createElement("span");
    mark.className = "blocker-option-mark";
    mark.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    btn.appendChild(mark);
    var lk = LOGO_FOR[key];
    if (lk && LOGOS[lk]) {
      var logo = document.createElement("span");
      logo.className = "blocker-option-logo";
      var img = document.createElement("img");
      img.alt = "";
      img.src = LOGOS[lk];
      logo.appendChild(img);
      btn.appendChild(logo);
    }
    var txt = document.createElement("span");
    txt.className = "blocker-option-text";
    var nm = document.createElement("span");
    nm.className = "blocker-option-name";
    nm.textContent = name;
    var ds = document.createElement("span");
    ds.className = "blocker-option-desc";
    ds.textContent = desc;
    txt.appendChild(nm);
    txt.appendChild(ds);
    btn.appendChild(txt);
    btn.addEventListener("click", function () {
      if (currentBlocker === key) { closeMenus(); return; }
      currentBlocker = key;
      store("ls19.blocker", key);
      verdictEpoch++;
      hostCache.clear();
      setBlockerUI();
      buildBlockerMenu();
      closeMenus();
      scan();
    });
    blockerMenu.appendChild(btn);
  });
}

/* ---- post picker ----------------------------------------------------------- */

function updatePostTrigger() {
  if (currentPost === -1) {
    postTriggerText.textContent = "Every Post";
    postTriggerDate.textContent = "";
    return;
  }
  var p = posts[currentPost];
  postTriggerText.textContent = (p && p.title) || "Latest post";
  postTriggerDate.textContent = p ? shortDate(p.date) : "";
}

function buildPostMenu() {
  postMenu.textContent = "";
  function row(label, date, sel, onClick) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "post-option";
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-selected", sel ? "true" : "false");
    var mark = document.createElement("span");
    mark.className = "post-option-mark";
    mark.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    var txt = document.createElement("span");
    txt.className = "post-option-text";
    txt.textContent = label;
    var dt = document.createElement("span");
    dt.className = "post-option-date";
    dt.textContent = date || "";
    btn.appendChild(mark);
    btn.appendChild(txt);
    btn.appendChild(dt);
    btn.addEventListener("click", onClick);
    postMenu.appendChild(btn);
  }
  row("Every Post (All Links)", "", currentPost === -1, function () {
    currentPost = -1;
    store("ls19.post", "__all__");
    closeMenus();
    updatePostTrigger();
    scan();
  });
  posts.forEach(function (p, i) {
    row(p.title, shortDate(p.date), i === currentPost, (function (idx, url) {
      return function () {
        currentPost = idx;
        store("ls19.post", url);
        closeMenus();
        updatePostTrigger();
        scan();
      };
    })(i, p.url));
  });
}

/* ---- menus open / close ---------------------------------------------------- */

function closeMenus() {
  blockerMenu.hidden = true;
  postMenu.hidden = true;
  blockerTrigger.setAttribute("aria-expanded", "false");
  postTrigger.setAttribute("aria-expanded", "false");
}
blockerTrigger.addEventListener("click", function (ev) {
  ev.stopPropagation();
  var open = !blockerMenu.hidden;
  closeMenus();
  if (!open) {
    blockerMenu.hidden = false;
    blockerTrigger.setAttribute("aria-expanded", "true");
  }
});
postTrigger.addEventListener("click", function (ev) {
  ev.stopPropagation();
  if (postTrigger.disabled) return;
  var open = !postMenu.hidden;
  closeMenus();
  if (!open) {
    postMenu.hidden = false;
    postTrigger.setAttribute("aria-expanded", "true");
  }
});
document.addEventListener("click", function (ev) {
  if (!blockerBar.contains(ev.target) && !postBar.contains(ev.target)) closeMenus();
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") closeMenus();
});

/* ---- the list: unblocked links only ---------------------------------------- */

var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
var ARROW_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';

function appendUnblocked(host, url, v) {
  if (rowMap.has(host)) return;
  var a = document.createElement("a");
  a.className = "item";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  var check = document.createElement("span");
  check.className = "check";
  check.innerHTML = CHECK_SVG;
  var h = document.createElement("span");
  h.className = "host";
  h.textContent = host;
  a.appendChild(check);
  a.appendChild(h);
  if (v && v.catId != null) {
    var why = document.createElement("button");
    why.type = "button";
    why.className = "why-cat";
    why.textContent = "Policy: " + (v.cat || "");
    why.title = "Mark this category blocked / allowed at your school";
    why.addEventListener("click", onCatClick);
    a.appendChild(why);
  }
  var ar = document.createElement("span");
  ar.className = "arrow";
  ar.innerHTML = ARROW_SVG;
  a.appendChild(ar);
  list.appendChild(a);
  rowMap.set(host, { url: url, el: a });
  unblockedCount++;
  countNum.textContent = String(unblockedCount);
  footer.style.display = "";
}

function whyText(v) {
  if (v.state === "blocked") {
    if (v.via === "fp") return "Block Page";
    if (v.via === "db") return v.cat ? "Policy: " + v.cat : "Filtered";
    return "No Connection";
  }
  if (v.via === "dead") return "Domain Dead";
  if (v.via === "unreachable") return "No Connection";
  if (v.via === "cat") return v.cat ? "Category: " + v.cat : "Unverified";
  if (v.via === "conflict") return "Another Filter Answered";
  return "Unverified";
}

function renderFiltered() {
  filteredList.textContent = "";
  filteredRows.forEach(function (fr) {
    var row = document.createElement("div");
    row.className = "frow" + (fr.v.state === "blocked" ? " is-blocked" : "");
    var h = document.createElement("span");
    h.className = "fhost";
    h.textContent = fr.host;
    row.appendChild(h);
    if (fr.v.catId != null) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "fwhy cat";
      b.textContent = whyText(fr.v);
      b.title = "Mark this category blocked / allowed at your school";
      b.addEventListener("click", onCatClick);
      row.appendChild(b);
    } else {
      var w = document.createElement("span");
      w.className = "fwhy";
      w.textContent = whyText(fr.v);
      row.appendChild(w);
    }
    filteredList.appendChild(row);
  });
}

/* Click a category label — anywhere it appears — to flip this school's
   policy for that category. Persisted, and the rescan re-derives every
   verdict from the cached facts, so it is instant. */
function onCatClick(ev) {
  ev.preventDefault();
  ev.stopPropagation();
  var carrier = ev.currentTarget;
  var host = null;
  if (carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("frow")) {
    var fh = carrier.parentNode.querySelector(".fhost");
    host = fh ? fh.textContent : null;
  } else if (carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("item")) {
    host = carrier.parentNode.querySelector(".host").textContent;
  }
  var fr = null, v = null;
  if (host) {
    for (var i = 0; i < filteredRows.length; i++) {
      if (filteredRows[i].host === host) { fr = filteredRows[i]; break; }
    }
  }
  if (!fr && carrier.parentNode && carrier.parentNode.classList &&
      carrier.parentNode.classList.contains("item")) {
    /* a listed (allowed-category) row: build a pseudo verdict from the label */
    var hostEl = carrier.parentNode.querySelector(".host");
    for (var j = 0; j < lastVerdicts.length; j++) {
      if (lastVerdicts[j].host === (hostEl ? hostEl.textContent : "")) {
        v = lastVerdicts[j].v;
        break;
      }
    }
  } else if (fr) {
    v = fr.v;
  }
  if (!v || v.catId == null) return;
  var was = catBlocked(+v.catId);
  catOverrides[String(+v.catId)] = was ? 1 : 0;
  saveCatOverrides();
  var name = (CAT[+v.catId] || CAT[0])[0];
  verdictEpoch++;
  hostCache.clear();
  scan('"' + name + '" marked ' + (was ? "allowed" : "blocked") +
       " at your school — rechecking…");
}

/* ---- scan ------------------------------------------------------------------- */

function resetScanUI() {
  list.textContent = "";
  list.style.display = "";
  rowMap = new Map();
  filteredRows = [];
  unblockedCount = 0;
  stateEmpty.style.display = "none";
  stateError.style.display = "none";
  filteredWrap.style.display = "none";
  filteredList.textContent = "";
  filteredList.classList.remove("open");
  filteredToggle.setAttribute("aria-expanded", "false");
  footer.style.display = "none";
  countNum.textContent = "0";
  liveHeader.classList.remove("done");
  liveBar.style.width = "0%";
  liveCount.textContent = "";
}

var lastVerdicts = [];   /* [{host, v}] — for category clicks on listed rows */

function removeUnblocked(host) {
  var rec = rowMap.get(host);
  if (!rec) return;
  if (rec.el && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
  rowMap.delete(host);
  unblockedCount = Math.max(0, unblockedCount - 1);
}

/* apply one verdict to the visible UI — works during the scan AND after it
   (the engine's authoritative pass reconciles through the same door) */
function applyVerdict(host, url, v) {
  lastVerdicts.push({ host: host, v: v });
  var rec = rowMap.get(host);
  if (v.state === "ok") {
    if (!rec) appendUnblocked(host, url, v);
    /* it may have been shown as filtered earlier (redemption / reconcile) —
       pull the stale entry so the expander only counts what is filtered NOW */
    for (var i = filteredRows.length - 1; i >= 0; i--) {
      if (filteredRows[i].host === host) filteredRows.splice(i, 1);
    }
  } else {
    if (rec) removeUnblocked(host);
    var fr = null;
    for (var i = 0; i < filteredRows.length; i++) {
      if (filteredRows[i].host === host) { fr = filteredRows[i]; break; }
    }
    if (fr) fr.v = v;
    else filteredRows.push({ host: host, url: url, v: v });
  }
  refreshCountsUI();
}

function refreshCountsUI() {
  countNum.textContent = String(unblockedCount);
  footer.style.display = unblockedCount ? "" : "none";
  if (filteredRows.length) {
    filteredWrap.style.display = "";
    filteredNum.textContent = String(filteredRows.length);
    renderFiltered();
  } else {
    filteredWrap.style.display = "none";
    filteredList.textContent = "";
  }
  if (unblockedCount) {
    list.style.display = "";
    stateEmpty.style.display = "none";
  } else if (liveHeader.classList.contains("done")) {
    list.style.display = "none";
    stateEmpty.style.display = "";
  }
}

/* the engine's authoritative pass knocks here when a late fact changed a
   verdict that was already shown */
onVerdictUpdate = function (host, v) {
  var url = null;
  var rec = rowMap.get(host);
  if (rec) url = rec.url;
  if (!url) {
    for (var i = 0; i < filteredRows.length; i++) {
      if (filteredRows[i].host === host) { url = filteredRows[i].url; break; }
    }
  }
  if (!url) url = "https://" + host + "/";
  applyVerdict(host, url, v);
};

function scan(customLabel) {
  run++;
  var myRun = run;
  resetScanUI();
  lastVerdicts = [];
  if (customLabel) setStatus(customLabel);
  var post = currentPost === -1 ? null : posts[currentPost];
  gatherLinks(post).then(function (links) {
    if (myRun !== run) return;
    var hosts = [], seen = new Set();
    links.forEach(function (l) {
      if (l.host && !seen.has(l.host)) { seen.add(l.host); hosts.push({ host: l.host, url: l.url }); }
    });
    if (!hosts.length) { finishScan(myRun); return; }

    if (currentBlocker === "all") {
      setStatus("Showing every link — no checks…");
      hosts.forEach(function (h) { appendUnblocked(h.host, h.url, null); });
      liveCount.innerHTML = "<b>" + hosts.length + "</b> links";
      finishScan(myRun);
      return;
    }

    if (!customLabel) setStatus("Checking " + hosts.length + " links…");
    var settled = 0, total = hosts.length;
    liveCount.innerHTML = "<b>0</b> of " + total;
    var idx = 0;
    function nextBatch() {
      if (myRun !== run) return;
      var batch = [];
      while (idx < hosts.length && batch.length < HOST_PAR) batch.push(hosts[idx++]);
      if (!batch.length) return;
      Promise.all(batch.map(function (h) {
        return checkHost(h.host, h.url).then(function (v) {
          if (myRun !== run) return;
          settled++;
          liveCount.innerHTML = "<b>" + settled + "</b> of " + total;
          liveBar.style.width = Math.round(settled / total * 100) + "%";
          applyVerdict(h.host, h.url, v);
          if (settled === total) finishScan(myRun);
        });
      })).then(nextBatch, nextBatch);
    }
    nextBatch();
  }, function () {
    if (myRun !== run) return;
    liveHeader.classList.add("done");
    stateError.style.display = "";
    list.style.display = "none";
  });
}

function finishScan(myRun) {
  if (myRun !== run) return;
  liveHeader.classList.add("done");
  countLabel.textContent = currentBlocker === "all" ? "links" : "unblocked";
  refreshCountsUI();
  redeemUnclear(myRun, 0);
}

/* The DB socket can come back after the wave gave up on it — one school
   network hiccup must not freeze half the blog as "unverified". Anything
   that filtered out for lack of proof gets two quiet second passes; the
   measured facts are already cached, so each pass is one lookup away from
   listing the link. */
function redeemUnclear(myRun, round) {
  if (myRun !== run || currentBlocker === "all" || round >= 2) return;
  var orphans = [];
  filteredRows.forEach(function (fr) {
    if (fr.v && (fr.v.via === "unverified" || fr.v.via === "unreachable" ||
                 fr.v.via === "dead")) orphans.push({ host: fr.host, url: fr.url });
  });
  if (!orphans.length) return;
  setTimeout(function () {
    if (myRun !== run) return;
    orphans.forEach(function (o) {
      checkHost(o.host, o.url, DB_PATIENCE_LONG).then(function (v) {
        if (myRun !== run) return;
        applyVerdict(o.host, o.url, v);
      });
    });
    redeemUnclear(myRun, round + 1);
  }, round === 0 ? 2500 : 15000);
}

filteredToggle.addEventListener("click", function () {
  var open = filteredList.classList.contains("open");
  filteredList.classList.toggle("open", !open);
  filteredToggle.setAttribute("aria-expanded", String(!open));
});

/* ---- copy ------------------------------------------------------------------- */

function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
copyBtn.addEventListener("click", function () {
  var urls = [];
  rowMap.forEach(function (r) { urls.push(r.url); });
  if (!urls.length) return;
  var text = urls.join("\n");
  function done() {
    copyBtn.textContent = "Copied";
    setTimeout(function () { copyBtn.textContent = "Copy URLs"; }, 1400);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () {
      if (legacyCopy(text)) done();
    });
  } else if (legacyCopy(text)) done();
});

/* ---- boot -------------------------------------------------------------------- */

function present(found) {
  presented = true;
  posts = found;
  currentPost = 0;
  var saved = unstore("ls19.post");
  if (saved === "__all__") currentPost = -1;
  else if (saved) {
    for (var i = 0; i < posts.length; i++) {
      if (posts[i].url === saved) { currentPost = i; break; }
    }
  }
  postBar.style.display = "";
  postTrigger.disabled = false;
  buildPostMenu();
  updatePostTrigger();
  scan();
}

function boot() {
  liveHeader.classList.remove("done");
  stateError.style.display = "none";
  setStatus("Looking through the latest post…");
  discoverPostsViaFeed().then(function (found) {
    blogBlocked = false;
    present(found);
  }, function () {
    setStatus("The blog is blocked here — reading it through the relay…");
    discoverPostsRelay(function (n) {
      if (!presented) setStatus("Reading the blog — " + n + " posts…");
    }, function (all) {
      if (!presented) {
        blogBlocked = true;
        calibrateIconTrust().then(function () { present(all.slice()); });
      } else {
        var known = new Set();
        posts.forEach(function (p) { known.add(p.url); });
        var fresh = all.filter(function (p) { return !known.has(p.url); });
        if (fresh.length) {
          posts = posts.concat(fresh);
          buildPostMenu();
        }
      }
    }).then(function () {}, function () {
      if (!presented) {
        liveHeader.classList.add("done");
        stateError.style.display = "";
        list.style.display = "none";
      }
    });
  });
}

retryBtn.addEventListener("click", function () {
  presented = false;
  boot();
});

setBlockerUI();
buildBlockerMenu();
boot();
</script>
